    drawBarChart('drillHourChart',hourOrder.map(h=>h),hVals,
      hVals.map(v=>v>=avg*1.2?'#2DD4A0':v>0&&v<=avg*0.75?'#F0656A':'#4C7CF7'),hTips);
    drawAvgLine('drillHourChart',avg,hVals);

    // Day chart
    const dLbls=DAY_ORDER.filter(d=>stats.byDay[d]);
    const dVals=dLbls.map(d=>stats.byDay[d].avgGRR);
    const dCounts=dLbls.map(d=>stats.byDay[d].count);
    const dTips=dLbls.map((d,i)=>`<span style="color:#8892B0">${d}</span> &nbsp;<strong>$${dVals[i].toFixed(2)}</strong> GR/RLS &nbsp;<span style="color:#4A5270">(${dCounts[i]} rel.)</span>`);
    const maxD=Math.max(...dVals)||1;
    drawBarChart('drillDayChart',dLbls.map(d=>d.slice(0,3)),dVals,
      dVals.map(v=>v===maxD?'#2DD4A0':v<avg*0.85?'#F0656A':'#4C7CF7'),dTips);
    drawAvgLine('drillDayChart',avg,dVals);
  });
}

// Per-neighborhood nest breakdown shown inside the drill modal
let drillSort={key:'avgGRR',dir:-1};   // sort state for the drill nest list
let _drillHood=null;                    // neighborhood currently drilled into

function drillNestData(){
  const data=getFilteredData().filter(r=>r.neighborhood===_drillHood);
  const m={};
  data.forEach(r=>{
    const key=r.nest_id||r.nest_address; if(!key) return;
    const grr=parseFloat(r.gross_revenue_24h_usd);
    const htrRaw=(r.hours_to_ride!=null&&r.hours_to_ride!=='')?r.hours_to_ride:r.hours_to_first_ride;
    const htr=parseFloat(htrRaw);
    const rides24h=parseFloat(r.rides_24h);
    if(!m[key]) m[key]={id:r.nest_id||'',addr:r.nest_address||r.nest_id||key,count:0,sumG:0,cntG:0,htrVals:[],cnt24h:0,qty:null};
    const b=m[key]; b.count++;
    if(!isNaN(grr)&&grr>0){b.sumG+=grr;b.cntG++;}
    if(!isNaN(htr)&&htr>0){b.htrVals.push(htr);}
    if(!isNaN(rides24h)&&rides24h>0){b.cnt24h++;}
    const qty=(r.nest_quantity!=null&&r.nest_quantity!=='')?parseInt(r.nest_quantity):NaN;
    if(!isNaN(qty)) b.qty=qty;   // nest max_quantity — constant per nest
  });
  return Object.values(m).map(b=>({...b,avgGRR:b.cntG?b.sumG/b.cntG:0,avgHTR:median(b.htrVals),captureRate24h:b.count?b.cnt24h/b.count:null}));
}

function sortDrillNests(key){
  if(drillSort.key===key) drillSort.dir*=-1; else { drillSort.key=key; drillSort.dir=(key==='addr')?1:-1; }
  const box=document.getElementById('drillNestBox');
  if(box) box.innerHTML=drillNestTable();
}

function drillNestTable(){
  let nests=drillNestData();
  if(!nests.length) return '<div style="padding:10px;color:var(--t3);font-size:12px">No nests in this neighborhood.</div>';
  const {key,dir}=drillSort;
  nests.sort((a,b)=>{
    if(key==='addr') return dir*String(a.addr).localeCompare(String(b.addr));
    // dir -1 = descending. (b-a) here would invert it: with dir=-1 it
    // evaluates to (a-b), i.e. ascending, while the header shows a ↓ arrow.
    return dir*(((a[key]??-Infinity)-(b[key]??-Infinity)));
  });
  const gvals=nests.map(n=>n.avgGRR).filter(v=>v>0).sort((a,b)=>a-b);
  const pill=v=>{
    if(v<=0||!gvals.length) return `<span class="pill b">${fmt$(v)}</span>`;
    const p=gvals.findIndex(x=>x>=v)/gvals.length;
    return `<span class="pill ${p>=0.75?'g':p>=0.25?'w':'b'}">${fmt$(v)}</span>`;
  };
  const arrow=k=>drillSort.key===k?(drillSort.dir===-1?' ↓':' ↑'):'';
  const th=(k,label,align)=>`<th onclick="sortDrillNests('${k}')" style="padding:6px;text-align:${align||'left'};cursor:pointer;user-select:none;${drillSort.key===k?'color:var(--accent)':''}" title="Sort by ${label}">${label}${arrow(k)}</th>`;
  const rows=nests.map((n,i)=>`<tr>
    <td style="color:var(--t3);text-align:right;padding-right:6px">${i+1}</td>
    <td style="font-size:12px">${n.addr}${n.id?`<span style="font-size:10px;color:var(--t3);font-family:monospace"> · ${String(n.id).slice(0,8)}</span>`:''}</td>
    <td style="text-align:right">${fmtN(n.count)}</td>
    <td>${pill(n.avgGRR)}</td>
    <td style="text-align:right;color:var(--t2)">${n.avgHTR!=null?n.avgHTR.toFixed(1)+'h':'—'}</td>
    <td style="text-align:right;color:var(--t2)">${n.captureRate24h!=null?(n.captureRate24h*100).toFixed(0)+'%':'—'}</td>
    <td style="text-align:right;font-weight:700;color:var(--t1)">${n.qty!=null?n.qty:'—'}</td>
  </tr>`).join('');
  return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><span style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)">Nests in this neighborhood — ${nests.length} · click a column to sort</span>${csvBtn('nests-'+(_drillHood||'area').replace(/[^a-z0-9]+/gi,'-'))}</div>
    <div style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r)">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead style="position:sticky;top:0;background:var(--s2);z-index:1">
          <tr style="text-align:left;color:var(--t3)">
            <th style="padding:6px;text-align:right">#</th>${th('addr','Nest')}${th('count','Releases','right')}${th('avgGRR','Avg GR/RLS')}${th('avgHTR','Med HTR','right')}${th('captureRate24h','Capture (24h)','right')}${th('qty','Qty','right')}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderDrillNests(){
  return `<div id="drillNestBox" style="margin-top:18px">${drillNestTable()}</div>`;
}

function drawAvgLine(id,avg,vals){
  const canvas=document.getElementById(id);
  if(!canvas||!avg) return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.width/dpr,H=canvas.height/dpr;
  const ctx=canvas.getContext('2d');
  const pad={t:18,r:12,b:28,l:38};
  const cH=H-pad.t-pad.b;
  const max=Math.max(...vals.filter(v=>v>0))*1.12||1;
  const y=pad.t+cH-(avg/max)*cH;
  ctx.save();
  ctx.strokeStyle='rgba(245,166,35,.6)';
  ctx.lineWidth=1;
  ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
  ctx.restore();
}

function closeDrill(){
  document.getElementById('drillModal').classList.remove('open');

function drawHoodMap(stats){

  const avgGRR=stats.avgGRR||NEST_FLEET_AVG||1;

    const r=grr/avgGRR;
    if(r>=1.30) return '#1a9e6b';

    if(r>=0.70) return '#f5a623';

    attribution:'&copy; <a href="https://carto.com/">CARTO</a> &copy; OpenStreetMap',
    maxZoom:19,subdomains:'abcd'
  }).addTo(_leafletMap);

  // Plot each nest individually — from live uploaded data (fall back to demo)
  let plotNests=_aggNests(getFilteredData());
  if(!plotNests.length) plotNests=NEST_GRR_DATA.map(n=>({
    address:n.address,neighborhood:n.neighborhood,lat:n.lat,lon:n.lon,

  }));
  const bounds=[];
  plotNests.forEach(n=>{
    if(!n.lat||!n.lon) return;
    const color=grrColor(n.avgGRR);
    const vs=((n.avgGRR/avgGRR-1)*100).toFixed(0);

function drawHoodMapCanvas(stats, el){
  el.innerHTML='<canvas id="hoodMapCanvas" style="width:100%;height:420px;display:block"></canvas>';
  const canvas=el.querySelector('canvas');
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1;
  canvas.width=canvas.offsetWidth*dpr;
  canvas.height=canvas.offsetHeight*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const W=canvas.offsetWidth, H=canvas.offsetHeight;

  // Geographic bounds — fixed for TLV
  const minLat=32.000, maxLat=32.118;
  const minLng=34.748, maxLng=34.848;
  const pad=20;
  function toXY(lat,lng){
    const x=pad+(lng-minLng)/(maxLng-minLng)*(W-pad*2);
    const y=pad+(maxLat-lat)/(maxLat-minLat)*(H-pad*2);
    return [x,y];
  }
  function poly(pts, fill, stroke, lw){
    ctx.beginPath();
    pts.forEach(([a,b],i)=>{ const [x,y]=toXY(a,b); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}
  }
  function line(pts,stroke,lw){
    ctx.beginPath();
    pts.forEach(([a,b],i)=>{ const [x,y]=toXY(a,b); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();
  }

  // Land background (Carto Voyager beige)

  ctx.lineTo(0,H); ctx.closePath();
  ctx.fillStyle='#aad3df'; ctx.fill();
  // Coastline

    {pts:[[32.075,34.763],[32.065,34.764],[32.055,34.765],[32.045,34.766]],c:'#ccc',w:1.5},// Herbert Samuel

    ctx.beginPath();ctx.arc(lx+5,iy,5,0,Math.PI*2);

    const mx=(e.clientX-rect.left)*(W/rect.width);
    const my=(e.clientY-rect.top)*(H/rect.height);
    const hit=bubbles.find(b=>Math.hypot(mx-b.x,my-b.y)<=b.r);
    if(hit){
      tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-32)+'px';
      tip.style.borderColor=hit.color;
      tip.innerHTML=`<span style="color:${hit.color}">${hit.name.replace('Tel Aviv - ','')}</span> &nbsp;<strong>${fmt$(hit.avgGRR)}</strong> GR/RLS &nbsp;<span style="color:#888">(${hit.count} rel.) — click to drill down</span>`;
      canvas.style.cursor='pointer';
    } else { tip.style.display='none'; canvas.style.cursor='default'; }
  };
  canvas.onmouseleave=()=>{tip.style.display='none';};
  canvas.onclick=function(e){
    const rect=canvas.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width);
    const my=(e.clientY-rect.top)*(H/rect.height);
    const hit=bubbles.find(b=>Math.hypot(mx-b.x,my-b.y)<=b.r);
    if(hit) openDrill(hit.name,e);
  };
}

function _coord(r){
  // 1) single WKT/location column, e.g. "POINT (34.7688 32.0762)" (lon lat order)
  for(const k of Object.keys(r)){
    if(!/location|geom|point|wkt|coordinate/i.test(k)) continue;
    const val=r[k];
    if(typeof val!=='string') continue;
    const mm=val.match(/(-?\d+(?:\.\d+)?)[ ,]+(-?\d+(?:\.\d+)?)/);
    if(mm){
      let a=parseFloat(mm[1]), b=parseFloat(mm[2]);
      // WKT POINT is (lon lat). Disambiguate by range: lat∈[-90,90], lon∈[-180,180].
      // For Israel lat≈32, lon≈34.7 — both plausible, so trust WKT order (lon first).
      let lon=a, lat=b;
      if(Math.abs(a)<=90 && Math.abs(b)>90) { lat=a; lon=b; } // clearly lat,lon order
      if(!isNaN(lat)&&!isNaN(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180) return [lat,lon];
    }
  }
  // 2) separate columns
  const latK=['nest_lat','lat','latitude','nest_latitude','release_lat','y'];
  const lonK=['nest_lon','lon','lng','long','longitude','nest_lng','nest_longitude','release_lon','release_lng','x'];
  let lat=null,lon=null;
  for(const k of latK){ if(r[k]!=null&&r[k]!==''){ const v=parseFloat(r[k]); if(!isNaN(v)){lat=v;break;} } }
  for(const k of lonK){ if(r[k]!=null&&r[k]!==''){ const v=parseFloat(r[k]); if(!isNaN(v)){lon=v;break;} } }
  return (lat&&lon)?[lat,lon]:null;
}
function _aggNests(rows){
  const m={};
  rows.forEach(r=>{
    const nestId=r.nest_id||r.nest_address; if(!nestId) return;
    const c=_coord(r); if(!c) return;
    const lat=c[0], lon=c[1];
    const grr=parseFloat(r.gross_revenue_24h_usd);
    const htrRaw=(r.hours_to_ride!=null&&r.hours_to_ride!=='')?r.hours_to_ride:r.hours_to_first_ride;
    const htr=parseFloat(htrRaw);
    if(!m[nestId]) m[nestId]={nestId,address:r.nest_address||nestId,neighborhood:r.nest_neighborhood||r.neighborhood||'',lat,lon,count:0,sumG:0,cntG:0,sumH:0,cntH:0};
    const b=m[nestId]; b.count++;
    if(!isNaN(grr)&&grr>0){b.sumG+=grr;b.cntG++;}
    if(!isNaN(htr)&&htr>0){b.sumH+=htr;b.cntH++;}
  });
  return Object.values(m).map(b=>({...b,avgGRR:b.cntG?b.sumG/b.cntG:0,avgHTR:b.cntH?b.sumH/b.cntH:null}));
}

// Reusable nest map. rows = releases to plot (already scoped by tab/week/day-hour);
// prevRows = the matching previous-week slice for the Δ WoW view (or null).
function renderNestMapCore({mountId,legendId,noteId,rows,prevRows,fill}){
  const el=document.getElementById(mountId);
  if(!el) return;
  const legendEl=legendId?document.getElementById(legendId):null;
  const noteEl=noteId?document.getElementById(noteId):null;
  const H = fill?'calc(100vh - 220px)':'440px';
  const destroy=()=>{ if(_maps[mountId]){try{_maps[mountId].remove();}catch(e){} delete _maps[mountId];} };
  const setEmpty=(msg)=>{
    destroy();
    el.style.cssText=`display:flex;align-items:center;justify-content:center;background:var(--s1);height:${H};min-height:360px;border-radius:8px`;
    el.innerHTML=`<span style="color:var(--t3);font-size:13px;max-width:440px;text-align:center;line-height:1.55">${msg}</span>`;
    if(legendEl) legendEl.innerHTML=''; if(noteEl) noteEl.textContent='';
  };

  if(typeof L==='undefined'){ setEmpty('Map requires an internet connection (Leaflet / OpenStreetMap tiles).'); return; }
  if(!rawData.length){ setEmpty('No data loaded — upload a release CSV to see nests on the map.'); return; }
  if(!rows||!rows.length){ setEmpty('No releases in the current selection to map.'); return; }

  const nests=_aggNests(rows);
  if(!nests.length){
    const anyCoord=rawData.some(r=>_coord(r));
    const sampleCols=rawData.length?Object.keys(rawData[0]).filter(k=>/lat|lon|lng|coord|geo|x$|y$/i.test(k)):[];
    setEmpty(anyCoord
      ? 'No nests with coordinates in the current selection.'
      : `Couldn’t find latitude/longitude columns in this data, so releases can’t be mapped.${sampleCols.length?` (Coordinate-looking columns found: <code>${sampleCols.join(', ')}</code>.)`:''}`);
    return;
  }

  const metric = nestMapMetric==='htr' ? 'avgHTR' : 'avgGRR';
  const metricName = nestMapMetric==='htr' ? 'HTR' : 'GR/RLS';
  const goodHigh = nestMapMetric!=='htr';               // GR/RLS higher=better; HTR lower=better
  const fmtMetric = v => v==null?'—':(nestMapMetric==='htr'?v.toFixed(1)+'h':'$'+v.toFixed(2));

  const usable = nests.filter(n=>n[metric]!=null);
  if(!usable.length){ setEmpty(`No ${metricName} values in the current selection.`); return; }

  // (re)create map
  el.style.cssText=`height:${H};min-height:360px;border-radius:8px;overflow:hidden;`;
  destroy();
  const map=L.map(mountId,{zoomControl:true,scrollWheelZoom:true,preferCanvas:true}).setView([32.068,34.782],13);
  _maps[mountId]=map;
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap contributors © CARTO',maxZoom:19}).addTo(map);

  const TEAL='#1ABC9C', RED='#C0392B', GREY='#7A8194';
  const counts=usable.map(n=>n.count), cMin=Math.min(...counts), cMax=Math.max(...counts)||1;
  const radiusFor=c=>6+((c-cMin)/((cMax-cMin)||1))*10;   // 6..16px

  // percentile thresholds on the metric
  const vals=usable.map(n=>n[metric]).sort((a,b)=>a-b);
  const pct=f=>vals.length?vals[Math.min(vals.length-1,Math.floor(vals.length*f))]:0;
  const p20=pct(.2),p40=pct(.4),p60=pct(.6),p80=pct(.8);
  const scaleColor=v=>{
    const bucket = v<=p20?0:v<=p40?1:v<=p60?2:v<=p80?3:4;
    const idx = goodHigh?bucket:4-bucket;               // invert for HTR
    return ['#C0392B','#E67E22','#F1C40F','#27AE60','#1ABC9C'][idx];
  };

  // previous-week nests for the Δ WoW view
  let prevMap=null;
  if(nestMapMode==='wow' && prevRows && prevRows.length){
    prevMap={};
    _aggNests(prevRows).forEach(n=>{ prevMap[n.nestId]=n; });
  }

  // decide which nests to draw and their colors
  let draw=[];
  if(nestMapMode==='edges'){
    usable.forEach(n=>{
      const v=n[metric];
      const isTop = goodHigh ? v>=p80 : v<=p20;
      const isBot = goodHigh ? v<=p20 : v>=p80;
      if(isTop) draw.push({n,color:TEAL,tag:'Top 20%'});
      else if(isBot) draw.push({n,color:RED,tag:'Bottom 20%'});
    });
  } else if(nestMapMode==='wow'){
    if(!prevMap){ setEmpty('No previous week to compare against. Pick a specific week (not “All weeks”) that has a week before it.'); return; }
    usable.forEach(n=>{
      const pv=prevMap[n.nestId];
      if(!pv||pv[metric]==null){ draw.push({n,color:GREY,tag:'New / no prior'}); return; }
      const d=n[metric]-pv[metric];
      const improved = goodHigh ? d>0 : d<0;
      const flat = Math.abs(d) < (nestMapMetric==='htr'?0.05:0.01);
      draw.push({n,color:flat?GREY:improved?TEAL:RED,tag:flat?'≈ Unchanged':improved?'Improved':'Worsened',delta:d,prev:pv[metric]});
    });
  } else {
    usable.forEach(n=>draw.push({n,color:scaleColor(n[metric])}));
  }

  const grp=L.layerGroup();
  const bounds=[];
  draw.forEach(d=>{
    const n=d.n; bounds.push([n.lat,n.lon]);
    const cm=L.circleMarker([n.lat,n.lon],{radius:radiusFor(n.count),stroke:true,color:'rgba(255,255,255,.85)',weight:1,fillColor:d.color,fillOpacity:.85});
    const edgeRow = (nestMapMode==='edges')?`<tr><td style="color:#888;padding:2px 0">Rank</td><td style="font-weight:700;color:${d.color}">${d.tag} by ${metricName}</td></tr>`:'';
    const prevRow = (nestMapMode==='wow'&&d.prev!=null)?`<tr><td style="color:#888;padding:2px 0">Last week</td><td style="font-weight:700">${fmtMetric(d.prev)}</td></tr>`:'';
    const deltaRow = (nestMapMode==='wow'&&d.delta!=null)?`<tr><td style="color:#888;padding:2px 0">Δ vs last wk</td><td style="font-weight:700;color:${d.color}">${d.delta>0?'+':''}${nestMapMetric==='htr'?d.delta.toFixed(1)+'h':'$'+d.delta.toFixed(2)} · ${d.tag}</td></tr>`:'';
    cm.bindPopup(`<div style="font-family:system-ui;min-width:200px"><div style="font-weight:700;font-size:12px">${n.address}</div><div style="font-size:11px;color:#888;margin-bottom:6px">${n.neighborhood}</div><table style="font-size:12px;width:100%"><tr><td style="color:#888;padding:2px 0;width:96px">Releases</td><td style="font-weight:700">${n.count}</td></tr><tr><td style="color:#888;padding:2px 0">Avg GR/RLS</td><td style="font-weight:700;color:#0a9">${n.avgGRR?('$'+n.avgGRR.toFixed(2)):'—'}</td></tr><tr><td style="color:#888;padding:2px 0">Avg HTR</td><td style="font-weight:700">${n.avgHTR!=null?n.avgHTR.toFixed(1)+'h':'—'}</td></tr>${edgeRow}${prevRow}${deltaRow}</table></div>`,{maxWidth:260});
    grp.addLayer(cm);
  });
  grp.addTo(map);
  if(bounds.length){ try{map.fitBounds(bounds,{padding:[30,30],maxZoom:15});}catch(e){} }

  if(noteEl){
    noteEl.textContent = nestMapMode==='edges'?`— best & worst 20% of nests by ${metricName}`
      : nestMapMode==='wow'?`— nests colored by ${metricName} change vs last week`
      : `— every nest colored by ${metricName} (${goodHigh?'high':'low'} = best)`;
  }
  if(legendEl){
    const chip=(c,l)=>`<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--t2)"><span style="width:12px;height:12px;border-radius:50%;background:${c};display:inline-block"></span>${l}</span>`;
    let items;
    if(nestMapMode==='edges') items=[chip(TEAL,`Top 20% ${metricName}`),chip(RED,`Bottom 20% ${metricName}`)];
    else if(nestMapMode==='wow') items=[chip(TEAL,'Improved'),chip(RED,'Worsened'),chip(GREY,'Unchanged / new')];
    else items=[chip('#1ABC9C','Best'),chip('#27AE60','High'),chip('#F1C40F','Mid'),chip('#E67E22','Low'),chip('#C0392B','Worst')];
    legendEl.innerHTML=items.join('')+`<span style="margin-left:8px;font-size:11px;color:var(--t3)">circle size = releases · ${draw.length} of ${usable.length} nests${nestMapMetric==='htr'?' · HTR: lower is better':''}</span>`;
  }

  setTimeout(()=>{ if(_maps[mountId]) _maps[mountId].invalidateSize(); },120);
}

// ── MODEL PERFORMANCE TAB ─────────────────────────────────────────────────────
function computeModelStats(data){
  const def=()=>({count:0,sumGRR:0,cntGRR:0});
  const byTier={},byStar={},scoreBuckets={};
  const TIERS=['Tier 1','Tier 2','Tier 3','Oversupply','Strategic Nest Override','No Nest','(unset)'];
  const STARS=['Starred','Non-Starred','No Nest','Strategic Nest Override','(unset)'];
  TIERS.forEach(t=>byTier[t]=def());
  STARS.forEach(s=>byStar[s]=def());

  let scoredCount=0,unscoredCount=0,scoredSumGRR=0,unscoredSumGRR=0;
  let scoredWithStarCount=0;
  const scoredStarredGRR=[],scoredNonStarredGRR=[];
  const scorePairs=[];   // excl oversupply (-1)
  const allScoredPairs=[];// incl oversupply

  // Fixed score buckets (excl -1 sentinel)
  const BUCKETS=[
    {lo:0,   hi:0.5,  label:'<0.50'},
    {lo:0.5, hi:0.7,  label:'0.50–0.70'},
    {lo:0.7, hi:0.8,  label:'0.70–0.80'},
    {lo:0.8, hi:0.85, label:'0.80–0.85'},
    {lo:0.85,hi:0.9,  label:'0.85–0.90'},
    {lo:0.9, hi:0.92, label:'0.90–0.92'},
    {lo:0.92,hi:0.93, label:'0.92–0.93'},
    {lo:0.93,hi:1.01, label:'0.93+'},
  ];
  BUCKETS.forEach(b=>scoreBuckets[b.label]={...def(),lo:b.lo,hi:b.hi,label:b.label});

  for(const r of data){
    const grr=n(r.gross_revenue_24h_usd);
    const score=r.entry_score!==undefined&&r.entry_score!==''?parseFloat(r.entry_score):null;
    const tier=r.tier&&r.tier.trim()?r.tier.trim():'(unset)';
    const star=r.star&&r.star.trim()?r.star.trim():'(unset)';

    // Tier
    const tb=byTier[tier]||(byTier[tier]=def());
    tb.count++;
    if(grr!=null){tb.sumGRR+=grr;tb.cntGRR++;}

    // Star
    const sb=byStar[star]||(byStar[star]=def());
    sb.count++;
    if(grr!=null){sb.sumGRR+=grr;sb.cntGRR++;}

    if(score!==null&&!isNaN(score)){
      scoredCount++;
      if(grr!=null) scoredSumGRR+=grr;
      allScoredPairs.push({score,grr:grr||0,star,tier});

      // excl oversupply (-1) for predictive analysis
      if(score>-0.5){
        scorePairs.push({score,grr:grr||0});
        const bkt=BUCKETS.find(b=>score>=b.lo&&score<b.hi);
        if(bkt){
          const bk=scoreBuckets[bkt.label];
          bk.count++;
          if(grr!=null){bk.sumGRR+=grr;bk.cntGRR++;}
        }
      }
      if(star==='Starred') scoredStarredGRR.push(grr||0);
      if(star==='Non-Starred') scoredNonStarredGRR.push(grr||0);
      if(star==='Starred') scoredWithStarCount++;
    } else {
      unscoredCount++;
      if(grr!=null) unscoredSumGRR+=grr;
    }
  }

  const total=data.length;

  // Star score coverage
  const totalStarred=byStar['Starred']?byStar['Starred'].count:0;
  const starScorePct=totalStarred>0?(scoredWithStarCount/totalStarred*100):0;

  // Pearson on scored excl -1
  let pearson=null,r2=null;
  if(scorePairs.length>1){
    const mx=scorePairs.reduce((s,p)=>s+p.score,0)/scorePairs.length;
    const my=scorePairs.reduce((s,p)=>s+p.grr,0)/scorePairs.length;
    const cov=scorePairs.reduce((s,p)=>s+(p.score-mx)*(p.grr-my),0)/scorePairs.length;
    const sx=Math.sqrt(scorePairs.reduce((s,p)=>s+(p.score-mx)**2,0)/scorePairs.length);
    const sy=Math.sqrt(scorePairs.reduce((s,p)=>s+(p.grr-my)**2,0)/scorePairs.length);
    pearson=sx*sy>0?cov/(sx*sy):0;
    r2=pearson*pearson;
  }

  // Score deciles (scored excl -1, sorted)
  const decilePairs=[...scorePairs].sort((a,b)=>a.score-b.score);
  const dq=Math.floor(decilePairs.length/10);
  const deciles=Array.from({length:10},(_,i)=>{
    const slice=decilePairs.slice(i*dq,(i+1)*dq);
    const gs=slice.map(p=>p.grr);
    const sc=slice.map(p=>p.score);
    return{d:i+1,minScore:sc[0],maxScore:sc[sc.length-1],avgGRR:gs.length?gs.reduce((a,b)=>a+b,0)/gs.length:0,count:gs.length};
  });

  return {
    total,scoredCount,unscoredCount,
    scoredGRR:scoredCount>0?scoredSumGRR/scoredCount:0,
    unscoredGRR:unscoredCount>0?unscoredSumGRR/unscoredCount:0,
    byTier,byStar,scoreBuckets,BUCKETS,
    totalStarred,scoredWithStarCount,starScorePct,
    pearson,r2,deciles,
    scoredStarredGRR,scoredNonStarredGRR,
  };
}

function renderModelTab(data){
  const ms=computeModelStats(data);

  // Scored-only avg
  const sStarAvg=ms.scoredStarredGRR.length?ms.scoredStarredGRR.reduce((a,b)=>a+b,0)/ms.scoredStarredGRR.length:0;
  const sNonStarAvg=ms.scoredNonStarredGRR.length?ms.scoredNonStarredGRR.reduce((a,b)=>a+b,0)/ms.scoredNonStarredGRR.length:0;
  const covPct=(ms.scoredCount/ms.total*100).toFixed(1);

  const kpis=`<div class="kpi-row" style="grid-template-columns:1fr 1fr 1fr 1fr;margin-bottom:18px">
    <div class="kpi">
      <div class="kpi-label">Scored releases</div>
      <div class="kpi-value">${ms.scoredCount.toLocaleString()}</div>
      <div class="kpi-sub">${covPct}% of all releases — excl. Oversupply (score=−1 sentinel)</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Pearson r</div>
      <div class="kpi-value warn">${ms.pearson!=null?ms.pearson.toFixed(3):'—'}</div>
      <div class="kpi-sub">score vs GR/RLS (scored rows, excl. Oversupply)</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">R² (variance explained)</div>
      <div class="kpi-value warn">${ms.r2!=null?(ms.r2*100).toFixed(1)+'%':'—'}</div>
      <div class="kpi-sub">score explains this much of GR/RLS variance</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Scored: Star vs Non-Star</div>
      <div class="kpi-value">${fmt$(sStarAvg)}</div>
      <div class="kpi-sub">Starred · <strong style="color:var(--t1)">${fmt$(sNonStarAvg)}</strong> Non-Starred (among scored only)</div>
    </div>
  </div>`;

  // Key finding callout
  const d1=ms.deciles[0],d3=ms.deciles[2],d10=ms.deciles[9];
  const cliffInsight=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px">
    <div class="insight opportunity">
      <div class="insight-tag">Key Finding · Binary Gate</div>
      <div class="insight-title">Score is a cliff, not a ramp</div>
      <div class="insight-body">
        Bottom decile (score&nbsp;${d1?d1.minScore.toFixed(2):'<0.79'}–${d1?d1.maxScore.toFixed(2):'0.79'}) → <strong>${fmt$(d1?d1.avgGRR:0)}</strong> avg GR/RLS.<br>
        Everything above score&nbsp;0.88 flatlines at <strong>$25–$29</strong> across 8 of the top 9 deciles.<br>
        The model works as a <strong>quality gate</strong> (pass/fail) — not as a continuous ranking signal within the passing band.
      </div>
    </div>
    <div class="insight warning">
      <div class="insight-tag">Key Finding · Star Label</div>
      <div class="insight-title">Stars don't outperform within scored rows</div>
      <div class="insight-body">
        Scored Starred: <strong>${fmt$(sStarAvg)}</strong> · Scored Non-Starred: <strong>${fmt$(sNonStarAvg)}</strong><br>
        Non-Starred actually edges ahead. Stars cut the top 15% of an already tightly-clustered score distribution (0.85–0.94) — the GR/RLS difference between those score positions is negligible.<br>
        <strong>Starred = high-score, but within high-score the label adds no signal.</strong>
      </div>
    </div>
  </div>`;

  // Decile table
  const decileRows=ms.deciles.map(d=>{
    const bar=Math.round(d.avgGRR/35*120);
    const barColor=d.avgGRR>24?'#2DD4A0':d.avgGRR>18?'#F5A623':'#F0656A';
    const isGate=d.d===1;
    return `<tr style="${isGate?'background:rgba(240,101,106,.04)':''}">
      <td style="font-weight:700;color:${isGate?'var(--bad)':'var(--t1)'}">D${d.d}</td>
      <td style="font-variant-numeric:tabular-nums;color:var(--t3);font-size:12px">${d.minScore.toFixed(3)} – ${d.maxScore.toFixed(3)}</td>
      <td>${fmtN(d.count)}</td>
      <td><span class="pill ${d.avgGRR>24?'g':d.avgGRR>18?'w':'b'}">${fmt$(d.avgGRR)}</span></td>
      <td><div style="background:var(--s3);border-radius:3px;height:8px;width:140px;overflow:hidden"><div style="background:${barColor};height:100%;width:${bar}px;border-radius:3px"></div></div></td>
    </tr>`;
  }).join('');

  const decileTable=`<div class="panel" style="margin-bottom:18px">
    <div class="panel-head">
      <span class="panel-title">GR/RLS by Score Decile — scored releases only</span>
      <span style="font-size:11px;color:var(--t3)">D1 = lowest 10% of scores · D10 = highest · Oversupply (score=−1) excluded</span>
    </div>
    <div class="tbl-wrap"><table><thead><tr>
      <th>Decile</th><th>Score range</th><th>Releases</th><th>Avg GR/RLS</th><th>Relative</th>
    </tr></thead><tbody>${decileRows}</tbody></table></div>
  </div>`;

  // Charts side by side
  const charts=`<div class="data-row" style="margin-bottom:18px">
    ${chartPanel('GR/RLS by Score Band','modelScoreChart',230)}
    ${chartPanel('GR/RLS by Tier','modelTierChart',230)}
  </div>`;

  // Tier table
  const TIER_ORDER=['Tier 1','Tier 2','Tier 3','Oversupply','Strategic Nest Override','No Nest','(unset)'];
  const allTierGRRs=TIER_ORDER.map(t=>ms.byTier[t]?ms.byTier[t].cntGRR>0?ms.byTier[t].sumGRR/ms.byTier[t].cntGRR:0:0);
  const maxTierGRR=Math.max(...allTierGRRs);
  const tierRows=TIER_ORDER.map(t=>{
    const d=ms.byTier[t];if(!d||!d.count) return '';
    const grr=d.cntGRR>0?d.sumGRR/d.cntGRR:0;
    const bar=maxTierGRR>0?Math.round(grr/maxTierGRR*120):0;
    const barColor=grr>24?'#2DD4A0':grr>14?'#F5A623':'#F0656A';
    const note=t==='Oversupply'?' ← score=−1 sentinel, forced release':t==='No Nest'?' ← unscored, no nest assigned':'';
    return `<tr>
      <td style="font-size:12px;font-weight:600">${t}<span style="color:var(--t3);font-weight:400;font-size:10px">${note}</span></td>
      <td>${fmtN(d.count)}</td>
      <td><span class="pill ${grr>24?'g':grr>14?'w':'b'}">${fmt$(grr)}</span></td>
      <td><div style="background:var(--s3);border-radius:3px;height:8px;width:140px;overflow:hidden"><div style="background:${barColor};height:100%;width:${bar}px;border-radius:3px"></div></div></td>
    </tr>`;
  }).join('');

  const tierTable=`<div class="panel" style="margin-bottom:18px">
    <div class="panel-head"><span class="panel-title">GR/RLS by Tier</span></div>
    <div class="tbl-wrap"><table><thead><tr>
      <th>Tier</th><th>Releases</th><th>Avg GR/RLS</th><th>Relative</th>
    </tr></thead><tbody>${tierRows}</tbody></table></div>
  </div>`;

  return kpis + cliffInsight + charts + decileTable + tierTable;
}

function drawModelCharts(data){
  const ms=computeModelStats(data);

  // Score band chart (excl -1)
  const bucketLabels=ms.BUCKETS.map(b=>b.label);
  const bucketGRR=ms.BUCKETS.map(b=>{const d=ms.scoreBuckets[b.label];return d&&d.cntGRR>0?d.sumGRR/d.cntGRR:0;});
  const bucketCounts=ms.BUCKETS.map(b=>{const d=ms.scoreBuckets[b.label];return d?d.count:0;});
  const overallAvg=ms.scoredGRR||1;
  const bucketColors=bucketGRR.map(v=>v>=overallAvg*1.05?'#2DD4A0':v>0&&v<overallAvg*0.8?'#F0656A':'#4C7CF7');
  const bucketTips=bucketLabels.map((l,i)=>`<span style="color:#8892B0">Score ${l}</span> &nbsp;<strong>$${bucketGRR[i].toFixed(2)}</strong> GR/RLS &nbsp;<span style="color:#4A5270">(${bucketCounts[i].toLocaleString()} rel.)</span>`);
  drawBarChart('modelScoreChart',bucketLabels,bucketGRR,bucketColors,bucketTips);

  // Tier chart
  const TIER_ORDER=['Tier 1','Tier 2','Tier 3','Oversupply','No Nest'];
  const tierGRR=TIER_ORDER.map(t=>{const d=ms.byTier[t];return d&&d.cntGRR>0?d.sumGRR/d.cntGRR:0;});
  const tierCounts=TIER_ORDER.map(t=>{const d=ms.byTier[t];return d?d.count:0;});
  const tierColors=tierGRR.map(v=>v>=24?'#2DD4A0':v>14?'#4C7CF7':'#F0656A');
  const tierTips=TIER_ORDER.map((t,i)=>`<span style="color:#8892B0">${t}</span> &nbsp;<strong>$${tierGRR[i].toFixed(2)}</strong> GR/RLS &nbsp;<span style="color:#4A5270">(${tierCounts[i].toLocaleString()} rel.)</span>`);
  drawBarChart('modelTierChart',['Tier 1','Tier 2','Tier 3','Oversp.','No Nest'],tierGRR,tierColors,tierTips);
}

// ── EXEC SUMMARY ─────────────────────────────────────────────────────────────
function getExecData(){
  // Follow the week selector when a specific week is chosen; otherwise (All Weeks)
  // default to the last FULL week (7 distinct days), falling back to most recent.
  function countUniqueDays(weekNum){
    return new Set(rawData.filter(r=>parseInt(r.release_week)===weekNum&&r.release_date).map(r=>r.release_date)).size;
  }
  const fullWeek = allWeeks.find(w=>countUniqueDays(w.num)>=7) || (allWeeks.length?allWeeks[0]:null);
  const execWeek = (currentWeekIdx>=0 && allWeeks[currentWeekIdx]) ? allWeeks[currentWeekIdx] : fullWeek;
  const execWeekIdx = execWeek ? allWeeks.indexOf(execWeek) : -1;
  const prevWeek    = execWeekIdx >= 0 && execWeekIdx < allWeeks.length-1 ? allWeeks[execWeekIdx+1] : null;

  const allWeekData = byCity(execWeek
    ? rawData.filter(r=>parseInt(r.release_week)===execWeek.num)
    : rawData);
  const prevWeekData = prevWeek
    ? byCity(rawData.filter(r=>parseInt(r.release_week)===prevWeek.num))
    : null;

  const overall     = computeStats(allWeekData);
  const overallPrev = prevWeekData ? computeStats(prevWeekData) : null;

  // Build prevHood lookup for WoW deltas
  const prevByHood = overallPrev ? overallPrev.byHood : {};

  // Derive segments from all sources that actually appear in the data (sorted by count desc)
  const sources=[...new Set(allWeekData.map(r=>r.release_source).filter(Boolean))]
    .sort((a,b)=>allWeekData.filter(r=>r.release_source===b).length - allWeekData.filter(r=>r.release_source===a).length);
  const segments=sources.map(src=>{
    const d=allWeekData.filter(r=>r.release_source===src);
    const s=computeStats(d);
    const pd=prevWeekData?prevWeekData.filter(r=>r.release_source===src):null;
    const ps=pd&&pd.length?computeStats(pd):null;
    const label=formatTypeLabel(src);
    if(!s||d.length<2) return null;
    const topHoods=Object.entries(s.byHood).sort((a,b)=>b[1].count-a[1].count).slice(0,8);
    const topOps=Object.values(s.byOperator||{}).sort((a,b)=>b.count-a.count).slice(0,3);
    const bestHood=Object.entries(s.byHood).sort((a,b)=>b[1].avgGRR-a[1].avgGRR)[0];
    const worstHood=Object.entries(s.byHood).filter(([,v])=>v.count>=5).sort((a,b)=>a[1].avgGRR-b[1].avgGRR)[0];
    const prevHoodMap = ps ? ps.byHood : {};
    return {src,label,s,ps,topHoods,topOps,bestHood,worstHood,count:d.length,prevHoodMap};
  }).filter(Boolean);

  const bestDay =Object.entries(overall.byDay).sort((a,b)=>b[1].avgGRR-a[1].avgGRR)[0];
  const bestHour=Object.entries(overall.byHour).sort((a,b)=>b[1].avgGRR-a[1].avgGRR)[0];
  const worstDay=Object.entries(overall.byDay).sort((a,b)=>a[1].avgGRR-b[1].avgGRR)[0];

  const weekLabel = execWeek
    ? `Week ${execWeek.num} · ${execWeek.label}`
    : 'All Weeks';

  return {overall,overallPrev,segments,bestDay,bestHour,worstDay,weekLabel,allWeekData,prevWeekData,prevByHood,prevWeek};
}

// ── EXEC SUMMARY SLIDE HELPERS ────────────────────────────────────────────────
function execDelta(d, inv, prefix){
  if(d==null) return '';
  // Treat a delta below the unit we actually display as flat, so a real change
  // never renders as a signed "0" (and 0 never renders with a ▼).
  const eps = prefix==='$' ? 0.005 : prefix==='h' ? 0.05 : prefix==='%' ? 0.05 : 0.5;
  if(Math.abs(d) < eps) return `<span style="font-size:11px;font-weight:700;color:#64748B;margin-left:5px">▬ 0</span>`;
  const good = inv ? d<0 : d>0;
  const col  = good ? '#16A34A' : '#DC2626';
  const arr  = d>0 ? '▲' : '▼';
  const abs  = prefix==='$' ? '$'+Math.abs(d).toFixed(2)
             : prefix==='h' ? Math.abs(d).toFixed(1)+'h'
             : prefix==='%' ? Math.abs(d).toFixed(1)+'%'
             : fmtN(Math.round(Math.abs(d)));
  return `<span style="font-size:11px;font-weight:700;color:${col};margin-left:5px">${arr} ${d>0?'+':''}${abs}</span>`;
}

function execHoodTable(hoods, overall, prevByHood){
  const maxCount = Math.max(...hoods.map(([,d])=>d.count),1);
  const allGRR   = overall.avgGRR||1;
  const TH = h=>`<th style="text-align:left;font-size:8.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#94A3B8;padding:0 5px 5px 0;white-space:nowrap">${h}</th>`;
  return `<table style="width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums">
    <thead><tr>${TH('Neighborhood')}${TH('GR/RLS ($)')}${TH('WoW')}${TH('Releases')}${TH('WoW')}${TH('HTR')}</tr></thead>
    <tbody>
    ${hoods.map(([name,d],i)=>{
      const relPct  = d.count/maxCount;
      const grrRel  = d.avgGRR/allGRR;
      const barCol  = grrRel>=1.1?'#29C6F0':grrRel>=0.9?'#93C5FD':'#FCA5A5';
      const bg      = i%2===0?'#FFFFFF':'#F8FAFC';
      const prev    = prevByHood&&prevByHood[name];
      const grrDelta= prev ? d.avgGRR - prev.avgGRR : null;
      const cntDelta= prev ? d.count  - prev.count  : null;
      function arrowCell(delta, inv, pfx){
        if(delta==null) return `<td style="padding:3px 5px 3px 0;color:#CBD5E1;font-size:10px">—</td>`;
        const good=inv?delta<0:delta>0;
        const col=good?'#16A34A':'#DC2626';
        const arr=delta>0?'▲':'▼';
        const val=pfx==='$'?`$${Math.abs(delta).toFixed(2)}`:Math.abs(delta).toFixed(0);
        return `<td style="padding:3px 5px 3px 0;font-size:10px;font-weight:700;color:${col};white-space:nowrap">${arr} ${delta>0?'+':''}${pfx==='$'?'':pfx}${val}</td>`;
      }
      return `<tr style="background:${bg}">
        <td style="padding:3px 5px 3px 0;font-weight:600;color:#0D1B3E;font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</td>
        <td style="padding:3px 5px 3px 0">
          <div style="display:flex;align-items:center;gap:5px">
            <div style="width:${Math.round(grrRel*30)}px;height:10px;background:${barCol};border-radius:2px;min-width:3px;max-width:50px;flex-shrink:0"></div>
            <span style="color:#0D1B3E;font-weight:700">${fmt$(d.avgGRR)}</span>
          </div>
        </td>
        ${arrowCell(grrDelta,false,'$')}
        <td style="padding:3px 5px 3px 0">
          <div style="display:flex;align-items:center;gap:5px">
            <div style="width:${Math.round(relPct*50)}px;height:7px;background:#F59E0B;border-radius:2px;min-width:2px;max-width:50px;flex-shrink:0"></div>
            <span style="color:#475569">${fmtN(d.count)}</span>
          </div>
        </td>
        ${arrowCell(cntDelta,false,'')}
        <td style="padding:3px 0 3px 0;color:#475569">${fmtH(d.avgHTR)}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
}

  if(htrD!=null) insights.push({col:htrD<0?'#16A34A':'#DC2626', text:`HTR ${htrD<0?'improved':'increased'} by ${Math.abs(htrD).toFixed(1)}h`});

  const header=`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#F8FAFC;border-bottom:1px solid #E2E8F0">
