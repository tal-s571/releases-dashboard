      <div style="text-align:right"><div style="font-size:24px;font-weight:700;color:#29C6F0;font-variant-numeric:tabular-nums">${fmt$(s.avgGRR)}${execDelta(grrD,false,'$')}</div><div style="font-size:10px;color:#64748B;letter-spacing:.06em;text-transform:uppercase">Avg GR/RLS</div></div>
      <div style="text-align:right"><div style="font-size:24px;font-weight:700;color:#0D1B3E;font-variant-numeric:tabular-nums">${fmtH(s.avgHTR)}${execDelta(htrD,true,'h')}</div><div style="font-size:10px;color:#64748B;letter-spacing:.06em;text-transform:uppercase">Avg HTR</div></div>
    </div>
  </div>`;

  const body=`<div style="display:grid;grid-template-columns:1.6fr 1fr;gap:0">
    <div style="padding:16px 20px;border-right:1px solid #E2E8F0">
      ${execSectionLabel('By Neighborhood — Top 8 by Releases')}
      ${execHoodTable(Object.entries(s.byHood).sort((a,b)=>b[1].count-a[1].count).slice(0,8), s, prevHoodMap)}
    </div>
    <div style="padding:16px 20px">
      ${execSectionLabel('Key Insights')}
      ${insights.map(ins=>`<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #F1F5F9;font-size:12px;color:#334155;line-height:1.4"><span style="color:${ins.col};flex-shrink:0;font-weight:700">—</span>${ins.text}</div>`).join('')}
      ${topOps.length?`<div style="margin-top:14px">${execSectionLabel('Top Operators')}</div>
        ${topOps.map((op,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #F1F5F9;font-size:12px;background:${i%2?'#F8FAFC':'#FFF'}">
          <div style="flex:1;color:#0D1B3E;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${op.name}">${op.name}</div>
          <div style="color:#64748B;font-size:11px">${op.count} rel.</div>
          <div style="color:#29C6F0;font-weight:700">${fmt$(op.avgGRR)}</div>
        </div>`).join('')}`:''}
    </div>
  </div>`;

  return execSlideWrap(header, body);
}

// ── SUPPLY GAP (recommendations vs releases) ─────────────────────────────────
function sortSupplyGap(k){ if(supplyGapSort.key===k) supplyGapSort.dir*=-1; else supplyGapSort={key:k,dir:-1}; render(); }
function toggleHoodDetail(i){ const el=document.getElementById('hd'+i); if(el) el.style.display = el.style.display==='none'?'table-row':'none'; }

function renderSupplyGap(){
  const pad=s=>`<div style="padding:40px;color:var(--t3);text-align:center;line-height:1.7">${s}</div>`;
  if(!rawData.length) return pad('Upload the release CSV first (the <strong>Upload CSV</strong> button).');
  if(!recData.length) return pad('Load the algorithm <strong style="color:var(--accent)">Recommendations CSV</strong> using the <strong>+ Recommendations</strong> button (top right).<br><br>This tab joins the algorithm\'s recommendations against actual releases to explain why well-performing nests are under-supplied — because they\'re never recommended (open them), or because they\'re recommended but suppliers don\'t act (operational gap).');

  const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const normDate=s=>{const m=String(s||'').match(/(\d{4})-(\d+)-(\d+)/);if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3];return {date:`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`,weekday:new Date(y,mo-1,d).getDay()};};
  const parseSlots=sv=>(String(sv||'').match(/\d+\.\d+|\d+/g)||[]).length;
  const cellLabel=(wd,hr)=>DOW[wd]+' '+String(hr).padStart(2,'0')+':00';

  // parse both datasets to nest|weekday|hour granularity
  const recParsed=recData.map(r=>{const t=r.recommendation_time_local;const nd=normDate(t);const hm=String(t||'').match(/,\s*(\d{1,2}):(\d{2})/)||String(t||'').match(/(\d{1,2}):(\d{2})/);return (nd&&hm)?{nest:r.nest_id,date:nd.date,wd:nd.weekday,hr:+hm[1],slots:parseSlots(r.score_values)}:null;}).filter(x=>x&&x.nest);
  const relParsed=rawData.map(r=>{const nd=normDate(r.release_date);if(!nd)return null;const hr=parseInt(r.release_hour);return {nest:r.nest_id,date:nd.date,wd:nd.weekday,hr:isNaN(hr)?null:hr,grr:parseFloat(r.gross_revenue_24h_usd),hood:r.nest_neighborhood||r.neighborhood||'',addr:r.nest_address||r.nest_id};}).filter(x=>x&&x.nest);

  // overlap window (dates present in BOTH files)
  const recDates=new Set(recParsed.map(r=>r.date)), relDates=new Set(relParsed.map(r=>r.date));
  const overlap=[...recDates].filter(d=>relDates.has(d)).sort();
  if(!overlap.length) return pad('No overlapping dates between the release and recommendation files. The two exports must cover the same days.<br>Recommendations: '+[...recDates].sort()[0]+' → '+[...recDates].sort().pop()+'<br>Releases: '+[...relDates].sort()[0]+' → '+[...relDates].sort().pop());
  const winStart=overlap[0], winEnd=overlap[overlap.length-1];
  const inWin=d=>d>=winStart&&d<=winEnd;

  // recommendation grid: nest|wd|hr -> offered slots (non-empty only)
  const recGrid={};
  recParsed.forEach(r=>{if(r.slots<=0||!inWin(r.date))return;const k=r.nest+'|'+r.wd+'|'+r.hr;recGrid[k]=Math.max(recGrid[k]||0,r.slots);});
  // release grid + per-nest aggregation
  const relGrid={}, nestAgg={};
  relParsed.forEach(r=>{if(!inWin(r.date))return;
    const n=nestAgg[r.nest]||(nestAgg[r.nest]={rel:0,sG:0,cG:0,hood:r.hood,addr:r.addr,cellGRR:{}});
    n.rel++; if(!isNaN(r.grr)&&r.grr>0){n.sG+=r.grr;n.cG++;}
    if(r.hr!=null){const k=r.nest+'|'+r.wd+'|'+r.hr;relGrid[k]=(relGrid[k]||0)+1;
      const ck=r.wd+'|'+r.hr;const cg=n.cellGRR[ck]||(n.cellGRR[ck]={s:0,c:0});if(!isNaN(r.grr)&&r.grr>0){cg.s+=r.grr;cg.c++;}}});
  // recommended cells per nest
  const recCellsByNest={};
  Object.keys(recGrid).forEach(k=>{const p=k.split('|');const nest=p[0],wd=+p[1],hr=+p[2];(recCellsByNest[nest]=recCellsByNest[nest]||[]).push({wd,hr,slots:recGrid[k],filled:(relGrid[k]||0)>0});});

  let nests=Object.entries(nestAgg).map(([id,v])=>{
    const avgGRR=v.cG?v.sG/v.cG:0;
    const rc=recCellsByNest[id]||[];
    const filled=rc.filter(c=>c.filled).length;
    const unfilled=rc.filter(c=>!c.filled).sort((a,b)=>b.slots-a.slots);
    return {id,hood:v.hood,addr:v.addr,rel:v.rel,avgGRR,recCells:rc.length,filled,unfilled,coverage:rc.length?filled/rc.length:null,cellGRR:v.cellGRR};
  }).filter(n=>n.rel>=3);
  if(!nests.length) return pad('Not enough overlapping nest data (need nest_id + ≥3 releases per nest in the shared window).');

  const fleetAvg=nests.reduce((s,n)=>s+n.avgGRR,0)/nests.length;
  const good=nests.filter(n=>n.avgGRR>fleetAvg);
  const COV=0.5; // acted on fewer than half its recommended weekday×hours
  good.forEach(n=>{
    if(n.recCells===0){n.cls='strategic';
      const cells=Object.entries(n.cellGRR).map(([k,v])=>{const p=k.split('|');return{wd:+p[0],hr:+p[1],avg:v.c?v.s/v.c:0};}).sort((a,b)=>b.avg-a.avg);
      n.suggest=cells.slice(0,3).map(c=>cellLabel(c.wd,c.hr));
    } else if(n.coverage<COV){n.cls='ops'; n.suggest=n.unfilled.slice(0,3).map(c=>cellLabel(c.wd,c.hr));}
    else {n.cls='served'; n.suggest=[];}
  });
  const ops=good.filter(n=>n.cls==='ops'), strategic=good.filter(n=>n.cls==='strategic'), served=good.filter(n=>n.cls==='served');

  // ── render ──
  const sk=supplyGapSort.key, sd=supplyGapSort.dir;
  const action=[...ops,...strategic].sort((a,b)=>{const av=a[sk],bv=b[sk];return (av==null?-1e9:av)<(bv==null?-1e9:bv)?-sd:(av>bv?sd:0);});
  const th=(k,label,al)=>`<th onclick="sortSupplyGap('${k}')" style="cursor:pointer;text-align:${al||'left'};${sk===k?'color:var(--accent)':''}">${label}${sk===k?(sd<0?' ▼':' ▲'):''}</th>`;
  const pctFmt=v=>v==null?'—':(v*100).toFixed(0)+'%';
  const clsMeta={ops:{label:'Increase Ops Effort',c:'var(--warn)',bg:'rgba(245,166,35,.14)'},strategic:{label:'Open as Strategic',c:'var(--accent)',bg:'rgba(41,198,240,.14)'}};

  const kpiRow=`<div class="kpi-row" style="grid-template-columns:1fr 1fr 1fr 1fr">
    <div class="kpi"><div class="kpi-label">Well-performing nests</div><div class="kpi-value">${good.length}</div><div class="kpi-sub">above $${fleetAvg.toFixed(1)} fleet avg · ≥3 releases</div></div>
    <div class="kpi" style="border-color:rgba(245,166,35,.3)"><div class="kpi-label">Operational Gap</div><div class="kpi-value warn">${ops.length}</div><div class="kpi-sub">recommended, under-served → push ops</div></div>
    <div class="kpi" style="border-color:rgba(41,198,240,.3)"><div class="kpi-label">Open as Strategic</div><div class="kpi-value" style="color:var(--accent)">${strategic.length}</div><div class="kpi-sub">rarely recommended → open the nest</div></div>
    <div class="kpi" style="border-color:rgba(45,212,160,.3)"><div class="kpi-label">Adequately served</div><div class="kpi-value good">${served.length}</div><div class="kpi-sub">recommended &amp; acted on</div></div>
  </div>`;

  const domPct=good.length?Math.round(100*ops.length/good.length):0;
  const headline=`<div class="panel" style="margin-bottom:18px"><div style="padding:14px 16px;font-size:13.5px;color:var(--t1);line-height:1.7">
    <strong style="color:var(--warn)">${domPct}% of well-performing nests are an operational gap</strong> — the algorithm recommended them at specific hours, but suppliers released far less than offered. Only <strong style="color:var(--accent)">${good.length?Math.round(100*strategic.length/good.length):0}%</strong> are truly "not opened" (rarely recommended). So the lever is mostly <strong>operational effort</strong>, not opening more nests.
  </div></div>`;

  const rows=action.map(n=>{
    const m=clsMeta[n.cls];
    return `<tr>
      <td style="color:var(--t1);font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(n.addr||'').replace(/"/g,'')}">${n.addr}</td>
      <td style="color:var(--t3);font-size:12px">${n.hood||'—'}</td>
      <td style="text-align:right;font-weight:700;color:var(--accent)">${fmt$(n.avgGRR)}</td>
      <td style="text-align:right;color:var(--t2)">${n.rel}</td>
      <td style="text-align:right;color:var(--t2)">${n.recCells}</td>
      <td style="text-align:right;color:${n.coverage!=null&&n.coverage<COV?'var(--bad)':'var(--t2)'}">${pctFmt(n.coverage)}</td>
      <td><span class="pill" style="color:${m.c};background:${m.bg}">${m.label}</span></td>
      <td style="color:var(--t2);font-size:12px">${n.suggest.length?n.suggest.join(', '):'—'}</td>
    </tr>`;
  }).join('');

  const table=`<div class="panel">
    <div class="panel-head"><span class="panel-title">Action list — well-performing nests needing attention (${action.length})</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        ${th('addr','Nest')}${th('hood','Neighborhood')}${th('avgGRR','Avg GR/RLS','right')}${th('rel','Releases','right')}${th('recCells','Rec Hours','right')}${th('coverage','Coverage','right')}
        <th>Action</th><th>Suggested weekday · hours</th>
      </tr></thead>
      <tbody>${rows||'<tr><td colspan="8" style="text-align:center;color:var(--t3);padding:20px">No well-performing nests need action in this window.</td></tr>'}</tbody>
    </table></div>
  </div>`;

  const caveat=`<div style="margin-top:12px;font-size:11.5px;color:var(--t3);line-height:1.6">
    Analysis window: <strong>${winStart} → ${winEnd}</strong> (dates present in both files). Join is at <strong>nest × weekday × hour</strong> — "Rec Hours" = distinct weekday·hour slots the algorithm recommended this nest; "Coverage" = share of those slots that saw at least one release. Recommendations are intermittent re-evaluations, so this is a timing-pattern signal, not a literal count of missed vehicles.
  </div>`;

  return `<div>${kpiRow}${headline}${table}${caveat}</div>`;
}

// ── QTY OPTIMIZER ────────────────────────────────────────────────────────────
function renderQtyOptimizer(){
  if(!rawData.length) return '<div style="padding:40px;color:var(--t3);text-align:center">Upload a CSV to see quantity recommendations.</div>';

  // Fixed trailing 14-day window, independent of the global week selector.
  // (Still respects the city filter via byCity.) This keeps recommendations
  // stable — browsing another week elsewhere no longer changes this tab.
  const scoped = byCity(rawData);
  const scopedDates = scoped.map(r=>parseDate(r.release_date)).filter(Boolean);
  const maxT = scopedDates.length ? Math.max(...scopedDates.map(d=>d.getTime())) : 0;
  const cutoff = maxT - 13*86400000;              // inclusive 14-day window
  const winDates = [];
  const weekData = scoped.filter(r=>{
    const d=parseDate(r.release_date);
    if(d && d.getTime()>=cutoff){ winDates.push(d); return true; }
    return false;
  });
  const windowNote = winDates.length
    ? `Based on the last 14 days · ${fmtDateRange(winDates)}`
    : 'Based on the last 14 days';

  // Current max-quantity may appear under several column names across exports
  const QTY_FIELDS=['nest_max_quantity','max_quantity','nest_max_qty','max_qty','current_quantity','nest_quantity','quantity'];
  const pickQty=r=>{for(const f of QTY_FIELDS){const v=r[f];if(v!=null&&v!==''){const p=parseInt(v);if(!isNaN(p))return p;}}return null;};

  // Aggregate per nest
  const nestMap={};
  weekData.forEach(r=>{
    const id=r.nest_id; if(!id) return;
    if(!nestMap[id]) nestMap[id]={
      id, address:r.nest_address||id, neighborhood:r.nest_neighborhood||r.neighborhood||'',
      count:0, sumGRR:0, cntGRR:0, sumHTR:0, cntHTR:0,
      currentQty: pickQty(r)
    };
    const n=nestMap[id];
    n.count++;
    const grr=parseFloat(r.gross_revenue_24h_usd);
    // Count $0 releases in the denominator. Excluding them averaged only the
    // releases that WORKED, so a nest failing 8 of 10 releases scored on the
    // strength of the 2 that earned. 24.9% of releases earn $0, and that
    // exclusion made these rows read ~33% above the headline KPI.
    if(!isNaN(grr)){n.sumGRR+=grr;n.cntGRR++;}
    const htr=parseFloat(r.hours_to_ride!=null&&r.hours_to_ride!==''?r.hours_to_ride:r.hours_to_first_ride);
    if(!isNaN(htr)&&htr>0){n.sumHTR+=htr;n.cntHTR++;}
  });

  const MIN_SHOW=3;      // show a nest at all
  const MIN_REC=6;       // enough signal to act on (else forced maintain / low confidence)
  const nests=Object.values(nestMap).map(n=>({
    ...n,
    avgGRR: n.cntGRR>0 ? n.sumGRR/n.cntGRR : 0,
    avgHTR: n.cntHTR>0 ? n.sumHTR/n.cntHTR : null,
    lowConf: n.count<MIN_REC,
  })).filter(n=>n.count>=MIN_SHOW);

  if(!nests.length) return '<div style="padding:40px;color:var(--t3);text-align:center">Not enough nest data in the last 14 days (need nest_id + ≥3 releases per nest).</div>';

  // Fleet mean + standard deviation for each metric (across nests, equal-weighted)
  const mean=a=>a.reduce((s,v)=>s+v,0)/(a.length||1);
  const std=(a,m)=>Math.sqrt(mean(a.map(v=>(v-m)*(v-m))))||1; // guard 0 → 1
  const grrVals=nests.map(n=>n.avgGRR);
  const fleetAvgGRR=mean(grrVals), stdGRR=std(grrVals,fleetAvgGRR);
  const htrVals=nests.filter(n=>n.avgHTR!=null).map(n=>n.avgHTR);
  const fleetAvgHTR=mean(htrVals), stdHTR=std(htrVals,fleetAvgHTR);

  // Quantity baseline (z-scored the same way, so it's comparable to the perf score)
  const qtyVals=nests.filter(n=>n.currentQty!=null).map(n=>n.currentQty);
  const fleetAvgQty=mean(qtyVals), stdQty=std(qtyVals,fleetAvgQty);

  // ── PERFORMANCE SCORE: each metric → 0–100 via z-score, weighted 70% GR/RLS + 30% HTR
  // z = (nest − fleet mean) / std ; score = 50 + 25·z  (average nest = 50)
  // Metrics are first SHRUNK toward the fleet mean by k = count/(count+K); a
  // low-sample nest is pulled to the middle so noise can't produce extreme scores.
  const SHRINK_K=5;
  nests.forEach(n=>{
    const k=n.count/(n.count+SHRINK_K);
    const adjGRR=fleetAvgGRR + (n.avgGRR-fleetAvgGRR)*k;
    const zGRR=(adjGRR-fleetAvgGRR)/stdGRR;
    n.grrScore=Math.min(100,Math.max(0, 50 + 25*zGRR));           // higher GR/RLS = better
    if(n.avgHTR!=null){
      const adjHTR=fleetAvgHTR + (n.avgHTR-fleetAvgHTR)*k;
      const zHTR=(adjHTR-fleetAvgHTR)/stdHTR;
      n.htrScore=Math.min(100,Math.max(0, 50 - 25*zHTR));         // lower HTR = better
    } else {
      n.htrScore=50;                                               // neutral when unknown
    }
    n.score=Math.round(0.50*n.grrScore + 0.50*n.htrScore);

    // ── RECOMMENDATION = supply mismatch, GATED by absolute performance ──
    // Put current qty on the same 0–100 scale, compare, but never grow a
    // below-average nest or shrink an above-average one.
    if(n.currentQty!=null){
      // ── RENEW: a nest that's currently OFF (qty 0) produced no releases, so
      // it has no fresh data to judge. Auto-bring it back to 1 to give it a
      // fair re-test next window (it lands as "low conf" until it re-accrues
      // ≥6 releases, so it can't be turned straight back off). ──
      if(n.currentQty===0){
        n.rec='renew'; n.newQty=1; n.qtyScore=null; n.gap=null; n.watch=false; n.targetQty=1;
        return;
      }
      const zQty=(n.currentQty-fleetAvgQty)/stdQty;
      n.qtyScore=Math.min(100,Math.max(0, 50 + 25*zQty));
      const gap=n.score-n.qtyScore;                                // + = under-supplied, − = over-supplied
      n.gap=Math.round(gap);
      const aboveAvg = n.score >= 50;                              // performs at/above fleet average
      // Hysteresis dead-band: only act on a clear gap (±18). The 10–18 soft
      // zone is left as "maintain" but flagged "watch" so near-threshold nests
      // don't flip increase↔maintain run to run. Low-confidence nests never act.
      const ENTER=18, WATCH=10;
      if(n.lowConf){ n.rec='maintain'; }
      else if(gap >= ENTER && aboveAvg) n.rec='increase';          // good nest that's clearly under-supplied
      // Decrease is NOT gated on absolute score. `score` is centred on 50 by
      // construction, so requiring score<50 made the top half of the fleet
      // structurally un-shrinkable however oversupplied it was (49 nests were
      // stuck at >=18pts oversupplied). `gap` already carries the relative
      // judgement — double-gating on the median only froze it.
      else if(gap <= -ENTER) n.rec='decrease';                      // clearly over-supplied for its performance
      else n.rec='maintain';                                        // matched, or inside the dead-band
      n.watch = n.rec==='maintain' && !n.lowConf && ((gap>=WATCH && aboveAvg) || gap<=-WATCH);
      // Target = the quantity whose qty-score matches performance (invert the
      // z-score mapping), clamped 1–12. Move toward it, but no more than ±2 at
      // once so no nest jumps too far in a single run; direction stays gated.
      const zTarget=(n.score-50)/25;
      const targetQty=Math.min(12, Math.max(1, Math.round(fleetAvgQty + zTarget*stdQty)));
      n.targetQty=targetQty;
      let step = targetQty - n.currentQty;
      step = Math.max(-2, Math.min(2, step));                       // cap jump at ±2
      if(n.rec==='increase') step=Math.max(0, step);                // never move against the recommendation
      else if(n.rec==='decrease') step=Math.min(0, step);
      else step=0;                                                  // maintain → hold
      n.newQty = Math.min(12, Math.max(1, n.currentQty + step));    // clamp 1–12 (qty-0 bumped to 1)

      // ── RETIRE: turn a nest OFF (→0) only for the very worst cases — a
      // confidently-sampled, bottom-tier performer that's already at the
      // minimum quantity and can't fall any further. Deliberately strict so
      // only genuine dead spots get pulled; the renew rule revives it later. ──
      const RETIRE_SCORE=15;                                        // bottom ~15/100
      if(!n.lowConf && n.score < RETIRE_SCORE && n.currentQty<=1){
        n.rec='retire'; n.newQty=0;
      }
    } else {
      n.rec='maintain'; n.newQty=null; n.qtyScore=null; n.gap=null; // can't assess mismatch without current qty
    }
  });

  // Sort by score desc
  nests.sort((a,b)=>b.score-a.score);

  const increase = nests.filter(n=>n.rec==='increase');
  const maintain = nests.filter(n=>n.rec==='maintain');
  const decrease = nests.filter(n=>n.rec==='decrease');
  const retire   = nests.filter(n=>n.rec==='retire');   // very worst → turned off (qty 0)
  const renew    = nests.filter(n=>n.rec==='renew');    // currently off → back to 1 to re-test

  const REC_META = {
    increase: {label:'Increase Qty', color:'var(--good)',  bg:'rgba(44,212,160,.12)', icon:'▲'},
    maintain: {label:'Maintain',     color:'var(--accent)', bg:'rgba(41,198,240,.10)', icon:'—'},
    decrease: {label:'Decrease Qty', color:'var(--bad)',   bg:'rgba(240,101,106,.12)', icon:'▼'},
    retire:   {label:'Turn Off',     color:'var(--bad)',   bg:'rgba(240,101,106,.18)', icon:'⏻'},
    renew:    {label:'Renew',        color:'var(--accent)', bg:'rgba(41,198,240,.10)', icon:'↻'},
  };

  // ── Qty totals & distribution ──────────────────────────────────────────────
  const nestsWithQty = nests.filter(n=>n.currentQty!=null);
  const oldTotal = nestsWithQty.reduce((s,n)=>s+n.currentQty,0);
  const newTotal = nestsWithQty.reduce((s,n)=>s+n.newQty,0);
  const qtyDist = {};
  nestsWithQty.forEach(n=>{
    qtyDist[n.newQty] = (qtyDist[n.newQty]||0) + 1;
  });

  // stash nests on window for CSV download
  window._qtyNests = nests;

  function nestRow(n){
    const m=REC_META[n.rec];
    const grrPct=((n.avgGRR/fleetAvgGRR-1)*100).toFixed(0);
    const grrSign=grrPct>=0?'+':'';
    const htrStr=n.avgHTR!=null?`${n.avgHTR.toFixed(1)}h`:'—';
    const scoreBar=`<div style="display:inline-flex;align-items:center;gap:6px">
      <div style="width:60px;height:5px;border-radius:3px;background:var(--s3);overflow:hidden">
        <div style="height:100%;width:${n.score}%;background:${n.score>=70?'var(--good)':n.score>=45?'var(--accent)':'var(--bad)'}"></div>
      </div>
      <span style="font-size:11px;color:var(--t3)">${n.score}</span>
    </div>`;
    const qtyCell = n.currentQty!=null
      ? `<span style="color:var(--t3)">${n.currentQty}</span> → <span style="font-weight:700;color:${n.rec==='increase'||n.rec==='renew'?'var(--good)':n.rec==='decrease'||n.rec==='retire'?'var(--bad)':'var(--t2)'}">${n.newQty}</span>`
      : `<span style="color:var(--t3)">—</span>`;
    return `<tr>
      <td style="color:var(--t1);font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${n.address}">${n.address}</td>
      <td style="color:var(--t3);font-size:12px">${n.neighborhood||'—'}</td>
      <td style="font-weight:700;color:var(--accent)">${fmt$(n.avgGRR)}</td>
      <td style="font-size:11px;color:${parseFloat(grrPct)>=0?'var(--good)':'var(--bad)'}">${grrSign}${grrPct}%</td>
      <td style="color:var(--t2)">${htrStr}</td>
      <td style="color:var(--t2)">${n.count}</td>
      <td>${scoreBar}</td>
      <td style="font-size:12px;font-variant-numeric:tabular-nums">${qtyCell}</td>
      <td><span style="font-size:11px;font-weight:700;color:${m.color};background:${m.bg};padding:2px 9px;border-radius:10px">${m.icon} ${m.label}</span>${n.lowConf?' <span style="font-size:10px;color:var(--t3)" title="Fewer than 6 releases in the last 14 days — not enough signal to act">low conf</span>':n.watch?' <span style="font-size:10px;color:var(--warn,#e0a800)" title="Near the change threshold — watching">watch</span>':''}</td>
    </tr>`;
  }

  function section(title, color, bg, icon, list){
    if(!list.length) return '';
    return `
      <div style="margin-bottom:18px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="font-size:13px;font-weight:700;color:${color}">${icon} ${title}</span>
          <span style="font-size:11px;font-weight:700;padding:1px 8px;border-radius:8px;background:${bg};color:${color}">${list.length}</span>
        </div>
        <div class="tbl-wrap" style="max-height:280px">
          <table>
            <thead><tr>
              <th>Nest</th><th>Neighborhood</th><th>Avg GR/RLS</th><th>vs Fleet</th>
              <th>Avg HTR</th><th>Releases</th><th>Score</th><th>Qty (Old → New)</th><th>Recommendation</th>
            </tr></thead>
            <tbody>${list.map(nestRow).join('')}</tbody>
          </table>
        </div>
      </div>`;
  }

  // ── Distributions ───────────────────────────────────────────────────────────
  const hasQty = nestsWithQty.length>0;
  const dcell=d=>{const c=d>0?'var(--good)':d<0?'var(--bad)':'var(--t3)';const s=d>0?'+':'';return `<td style="text-align:right;font-weight:700;color:${c}">${s}${d}</td>`;};

  // Nests per quantity — before (currentQty) vs after (newQty)
  const beforeDist={};
  nestsWithQty.forEach(n=>{ beforeDist[n.currentQty]=(beforeDist[n.currentQty]||0)+1; });
  const allQtys=[...new Set([...Object.keys(beforeDist),...Object.keys(qtyDist)].map(Number))].sort((a,b)=>a-b);

  // Per-neighborhood — recommendation counts always; qty before/after when available
  const hoodAgg={};
  nests.forEach(n=>{
    const k=n.neighborhood||'—';
    if(!hoodAgg[k]) hoodAgg[k]={inc:0,maint:0,dec:0,nests:0,before:0,after:0,list:[]};
    hoodAgg[k].nests++; hoodAgg[k].list.push(n);
    if(n.rec==='increase'||n.rec==='renew') hoodAgg[k].inc++; else if(n.rec==='decrease'||n.rec==='retire') hoodAgg[k].dec++; else hoodAgg[k].maint++;
    if(n.currentQty!=null){ hoodAgg[k].before+=n.currentQty; hoodAgg[k].after+=n.newQty; }
  });
  const hoodRowsArr=Object.entries(hoodAgg).sort((a,b)=>b[1].nests-a[1].nests);

  const qtyDistPanel = `
    <div class="panel" style="margin-bottom:18px">
      <div class="panel-head" style="display:flex;align-items:center;justify-content:space-between">
        <span class="panel-title">Fleet Total &amp; Distribution Change</span>
        <button onclick="downloadQtyCSV()" style="padding:5px 14px;border-radius:6px;background:var(--accent);color:#0D1B3E;font-size:12px;font-weight:700;border:none;cursor:pointer">⬇ Download CSV</button>
      </div>
      <div style="padding:14px 16px">
        ${hasQty ? `
        <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:8px">Total Fleet Qty</div>
        <div style="display:flex;gap:24px;margin-bottom:20px">
          <div><div style="font-size:11px;color:var(--t3)">Before</div><div style="font-size:22px;font-weight:700;color:var(--t1)">${oldTotal}</div></div>
          <div style="font-size:22px;color:var(--t3);align-self:center">→</div>
          <div><div style="font-size:11px;color:var(--t3)">After</div><div style="font-size:22px;font-weight:700;color:${newTotal>oldTotal?'var(--good)':newTotal<oldTotal?'var(--bad)':'var(--t1)'}">${newTotal}</div></div>
          <div style="align-self:center"><span style="font-size:13px;font-weight:700;color:${newTotal>=oldTotal?'var(--good)':'var(--bad)'}">${newTotal>=oldTotal?'▲ +':'▼ '}${newTotal-oldTotal}</span></div>
        </div>
        <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:8px">Nests per Quantity</div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Quantity</th><th style="text-align:right">Nests Before</th><th style="text-align:right">Nests After</th><th style="text-align:right">Δ</th></tr></thead>
          <tbody>${allQtys.map(q=>{const b=beforeDist[q]||0,a=qtyDist[q]||0;return `<tr>
            <td style="font-weight:700;color:var(--t1)">${q}</td>
            <td style="text-align:right;color:var(--t2)">${b}</td>
            <td style="text-align:right;color:var(--t1);font-weight:600">${a}</td>
            ${dcell(a-b)}
          </tr>`;}).join('')}</tbody>
        </table></div>`
        : `<div style="font-size:12.5px;color:var(--t2);line-height:1.7">Current quantity per nest isn't in this CSV (no <code style="background:var(--s3);padding:1px 5px;border-radius:4px">nest_max_quantity</code> column), so before→after quantities can't be shown. The recommendation counts are in the tiles above, and the neighborhood breakdown below shows recommendations per area. Add a max-quantity column to unlock the quantity distribution and the new-total math.</div>`}
      </div>
    </div>`;

  // ── Neighborhood-level breakdown (rows expand to per-nest detail) ────────────
  const nColspan = hasQty?9:6;
  function hoodDetail(list){
    const rows=[...list].sort((a,b)=>({increase:0,maintain:1,decrease:2}[a.rec]-{increase:0,maintain:1,decrease:2}[b.rec])||b.score-a.score).map(n=>{
      const m=REC_META[n.rec];
      const qc=n.currentQty!=null?`<span style="color:var(--t3)">${n.currentQty}</span> → <span style="font-weight:700;color:${n.rec==='increase'||n.rec==='renew'?'var(--good)':n.rec==='decrease'||n.rec==='retire'?'var(--bad)':'var(--t2)'}">${n.newQty}</span>`:'—';
      return `<tr>
        <td style="padding-left:24px;color:var(--t2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(n.address||'').replace(/"/g,'')}">${n.address||n.id}</td>
        <td style="text-align:right;color:var(--accent);font-weight:600">${fmt$(n.avgGRR)}</td>
        <td style="text-align:right;color:var(--t3)">${n.score}</td>
        <td style="text-align:right;font-variant-numeric:tabular-nums">${qc}</td>
        <td style="text-align:right"><span class="pill" style="color:${m.color};background:${m.bg}">${m.icon} ${m.label}</span></td>
      </tr>`;
    }).join('');
    return `<td colspan="${nColspan}" style="padding:0;background:var(--bg)"><table style="width:100%"><thead><tr>
      <th style="padding-left:24px">Nest</th><th style="text-align:right">Avg GR/RLS</th><th style="text-align:right">Score</th><th style="text-align:right">Qty</th><th style="text-align:right">Recommendation</th>
    </tr></thead><tbody>${rows}</tbody></table></td>`;
  }
  const hoodPanel = hoodRowsArr.length ? `
    <div class="panel" style="margin-bottom:18px">
      <div class="panel-head"><span class="panel-title">By Neighborhood${hasQty?' — Qty Before → After':' — Recommendations'}</span><span style="font-size:11px;color:var(--t3)">click a row for nest detail</span></div>
      <div style="padding:14px 16px">
        <div class="tbl-wrap" style="max-height:420px"><table>
          <thead><tr><th>Neighborhood</th><th style="text-align:right">Nests</th><th style="text-align:right;color:var(--good)">▲ Inc</th><th style="text-align:right">— Maint</th><th style="text-align:right;color:var(--bad)">▼ Dec</th>${hasQty?'<th style="text-align:right">Qty Before</th><th style="text-align:right">Qty After</th><th style="text-align:right">Δ</th>':''}</tr></thead>
          <tbody>${hoodRowsArr.map(([name,d],i)=>`<tr onclick="toggleHoodDetail(${i})" style="cursor:pointer">
            <td style="font-weight:600;color:var(--t1)"><span style="color:var(--accent);opacity:.6;font-size:10px">▶</span> ${name}</td>
            <td style="text-align:right;color:var(--t3)">${d.nests}</td>
            <td style="text-align:right;color:var(--good);font-weight:600">${d.inc||''}</td>
            <td style="text-align:right;color:var(--t2)">${d.maint||''}</td>
            <td style="text-align:right;color:var(--bad);font-weight:600">${d.dec||''}</td>
            ${hasQty?`<td style="text-align:right;color:var(--t2)">${d.before}</td><td style="text-align:right;color:var(--t1);font-weight:600">${d.after}</td>${dcell(d.after-d.before)}`:''}
          </tr><tr id="hd${i}" style="display:none">${hoodDetail(d.list)}</tr>`).join('')}</tbody>
        </table></div>
      </div>
    </div>` : '';

  const logicBox = `
    <div class="panel" style="margin-bottom:18px">
      <div class="panel-head"><span class="panel-title">How Recommendations Are Calculated</span></div>
      <div style="padding:14px 16px 6px;font-size:12px;color:var(--t2);line-height:1.7">
        Computed over the <strong>last 14 days</strong> (independent of the week selector). We build two 0–100 scores per nest and compare them. A change is recommended only when supply is <strong>out of line</strong> with performance — a weak nest that already has a low quantity is correctly matched and stays put. To keep recommendations stable week-to-week, low-sample metrics are pulled toward the fleet average (<strong>shrinkage</strong>), nests with fewer than 6 releases are marked <em>low conf</em> and never change, and a change fires only past a <strong>±18-pt</strong> gap (the 10–18 "watch" zone holds at maintain). When a change is warranted the new quantity moves toward the nest's <strong>optimal</strong> level (the qty matching its performance), capped at <strong>±2</strong> per run.
      </div>
      <div style="padding:0 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div>
          <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px">Performance Score</div>
          <div style="font-size:12px;color:var(--t2);line-height:1.7">Each metric is measured as standard deviations from the fleet average (z-score) → 0–100 with the average nest at 50. Combined <strong style="color:var(--accent)">50% GR/RLS + 50% HTR</strong> (HTR inverted — faster pickup is better). Missing HTR scores a neutral 50. GR/RLS here is revenue per release <strong>counting $0 releases</strong>, so a nest that often fails scores lower.</div>
        </div>
        <div>
          <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px">Quantity Score</div>
          <div style="font-size:12px;color:var(--t2);line-height:1.7">The nest's current max-quantity put on the same 0–100 scale (average qty = 50). This represents how much supply the nest currently gets, so it's directly comparable to its performance.</div>
        </div>
      </div>
      <div style="padding:0 16px 14px;display:flex;gap:20px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)"><span style="color:var(--good);font-weight:700">▲ Increase</span> Under-supplied by 18+ pts <em style="color:var(--t3)">and</em> performs above average</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)"><span style="color:var(--accent);font-weight:700">— Maintain</span> Matched — or a strong nest that's already full / a weak one already lean</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)"><span style="color:var(--bad);font-weight:700">▼ Decrease</span> Over-supplied by 18+ pts relative to its own performance</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)"><span style="color:var(--bad);font-weight:700">⏻ Turn Off</span> Only the very worst — a confidently-sampled nest scoring below 15/100 that's already at qty 1</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)"><span style="color:var(--accent);font-weight:700">↻ Renew</span> A nest currently off (qty 0) is brought back to 1 to re-test — it has no fresh data to judge</div>
      </div>
    </div>`;

  const summary = `
    <div style="font-size:12px;color:var(--t3);margin-bottom:12px">${windowNote}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px">
      <div class="kpi" style="border-color:rgba(44,212,160,.3)">
        <div class="kpi-label">Increase Qty</div>
        <div class="kpi-value good">${increase.length}</div>
        <div class="kpi-sub">nests · avg score ${increase.length?Math.round(increase.reduce((s,n)=>s+n.score,0)/increase.length):0}/100</div>
      </div>
      <div class="kpi" style="border-color:rgba(41,198,240,.3)">
        <div class="kpi-label">Maintain</div>
        <div class="kpi-value" style="color:var(--accent)">${maintain.length}</div>
        <div class="kpi-sub">nests · avg score ${maintain.length?Math.round(maintain.reduce((s,n)=>s+n.score,0)/maintain.length):0}/100</div>
      </div>
      <div class="kpi" style="border-color:rgba(240,101,106,.3)">
        <div class="kpi-label">Decrease Qty</div>
        <div class="kpi-value bad">${decrease.length}</div>
        <div class="kpi-sub">nests · avg score ${decrease.length?Math.round(decrease.reduce((s,n)=>s+n.score,0)/decrease.length):0}/100</div>
      </div>
    </div>
    ${(retire.length||renew.length) ? `<div style="font-size:12px;color:var(--t2);margin:-8px 0 18px;display:flex;gap:18px;flex-wrap:wrap">
      ${retire.length?`<span><span style="color:var(--bad);font-weight:700">⏻ ${retire.length} turned off</span> — bottom-tier nests already at qty 1 (score &lt;15)</span>`:''}
      ${renew.length?`<span><span style="color:var(--accent);font-weight:700">↻ ${renew.length} renewing</span> — currently off, brought back to 1 to re-test</span>`:''}
    </div>` : ''}`;

  return summary + qtyDistPanel + hoodPanel + logicBox;
}

function downloadQtyCSV(){
  const nests = window._qtyNests;
  if(!nests||!nests.length){alert('No data to export.');return;}
  const rows = [['nest_id','new_qty','old_qty','neighborhood','recommendation']];
  // Only nests whose quantity actually changed
  const changed=nests.filter(n=>n.currentQty!=null&&n.newQty!=null&&n.newQty!==n.currentQty);
  if(!changed.length){alert('No nests changed quantity.');return;}
  const sorted=changed.sort((a,b)=>a.newQty-b.newQty);
  sorted.forEach(n=>{
    rows.push([
      n.id,
      n.newQty!=null?n.newQty:'',
      n.currentQty!=null?n.currentQty:'',
      `"${(n.neighborhood||'').replace(/"/g,'""')}"`,
      n.rec
    ]);
  });
  // Totals row (changed nests only)
  const oldTotal=changed.reduce((s,n)=>s+n.currentQty,0);
  const newTotal=changed.reduce((s,n)=>s+n.newQty,0);
  rows.push([]);
  rows.push(['TOTAL',newTotal,oldTotal,'',changed.length+' changed']);
  const csv=rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='qty_recommendations.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function renderExecSummary(){
  if(!rawData.length) return '<div style="padding:40px;color:var(--t3);text-align:center">No data loaded.</div>';
  const {overall,overallPrev,weekLabel,prevByHood,allWeekData,prevWeekData}=getExecData();

  const prevWeekLabel = (()=>{
    const {prevWeek} = getExecData();
    return prevWeek?`Week ${prevWeek.num} · ${prevWeek.label}`:'prev week';
  })();

  const prevTypeMap=overallPrev?overallPrev.byType:{};
  // Main types shown individually; everything else (load & deploy, recover,
  // recover damaged, …) bundled into a single "Other" row.
  const isMainType=t=>/charge|rebalance|ad.?hoc/i.test(t);
  function combineTypes(entries){
    const c={count:0,sumGRR:0,cntGRR:0,sumHTR:0,cntHTR:0};
    entries.forEach(([,d])=>{c.count+=d.count||0;c.sumGRR+=d.sumGRR||0;c.cntGRR+=d.cntGRR||0;c.sumHTR+=d.sumHTR||0;c.cntHTR+=d.cntHTR||0;});
    c.avgGRR=c.cntGRR?c.sumGRR/c.cntGRR:0;
    c.avgHTR=c.cntHTR?c.sumHTR/c.cntHTR:null;
    return c;
  }
  const mainEntries=Object.entries(overall.byType).filter(([t])=>isMainType(t)).sort((a,b)=>b[1].count-a[1].count);
  const otherEntries=Object.entries(overall.byType).filter(([t])=>!isMainType(t));
  const otherPrevEntries=Object.entries(prevTypeMap).filter(([t])=>!isMainType(t));
  // prepared rows: {label, d, p, isMain}
  const typeRows=mainEntries.map(([t,d])=>({label:formatTypeLabel(t),d,p:prevTypeMap[t],isMain:true}));
  if(otherEntries.length){
    typeRows.push({label:`Other (${otherEntries.length})`,d:combineTypes(otherEntries),p:otherPrevEntries.length?combineTypes(otherPrevEntries):null,isMain:false});
  }
  const topHoods=Object.entries(overall.byHood)
    .map(([name,d])=>({name,...d}))
    .filter(h=>h.count>=3&&h.name!=='Unknown'&&h.name!=='unknown')
    .sort((a,b)=>b.count-a.count).slice(0,10);

  // ── helpers ──
  function wow(d,inv,fmt,pct){
    if(d==null) return `<span style="color:#CBD5E1;font-size:10.5px">—</span>`;
    if(Math.abs(d)<(fmt==='n'?0.5:fmt==='h'?0.05:0.005)) return `<span style="color:#94A3B8;font-weight:700;font-size:10.5px">▬ 0</span>`;
    const good=inv?d<0:d>0;
    const col=good?'#16A34A':'#DC2626';
    const abs=fmt==='$'?'$'+Math.abs(d).toFixed(2):fmt==='h'?Math.abs(d).toFixed(1)+'h':fmtN(Math.round(Math.abs(d)));
    const pctTxt=(pct!=null&&isFinite(pct))?` <span style="opacity:.8;font-weight:600">(${pct>0?'+':''}${pct.toFixed(0)}%)</span>`:'';
    return `<span style="color:${col};font-weight:700;font-size:10.5px">${d>0?'▲ +':'▼ '}${abs}${pctTxt}</span>`;
  }
  const pctOf=(d,base)=>(base?d/base*100:null);

  // ── opportunities & underperforming — across all release types ──
  const chargeLabel='all';
  const {opps,warns}=generateInsights(overall);

  function insightCard(item){
    const isOpp=item.type==='opportunity';
    const bg=isOpp?'#F0FDF4':'#FFF8F1';
    const border=isOpp?'#16A34A':'#F59E0B';
    const tagCol=isOpp?'#16A34A':'#D97706';
    const tagBg=isOpp?'rgba(22,163,74,.1)':'rgba(245,158,11,.12)';
    return `<div style="padding:8px 10px;border-radius:6px;background:${bg};border-left:3px solid ${border};margin-bottom:6px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
        <span style="font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:${tagCol};background:${tagBg};padding:1px 7px;border-radius:8px">${item.tag}</span>
        <span style="font-size:12px;font-weight:700;color:#0D1B3E">${item.title}</span>
      </div>
      <div style="font-size:11.5px;color:#334155;line-height:1.6">${item.body}</div>
      <div style="font-size:10.5px;font-weight:700;color:${tagCol};margin-top:3px">→ ${item.action}</div>
    </div>`;
  }

  const insightsHtml=`
    <div style="margin-bottom:4px;font-size:10px;color:#94A3B8;font-style:italic">Based on <strong style="color:#29C6F0">${chargeLabel}</strong> releases</div>
    <div style="margin-bottom:8px">
      <div style="font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#16A34A;margin-bottom:6px">▲ Opportunities</div>
      ${opps.map(insightCard).join('')}
    </div>
    <div>
      <div style="font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#D97706;margin-bottom:6px">▼ Underperforming</div>
      ${warns.map(insightCard).join('')}
    </div>`;

  // ── metrofun nests — new cell-type performance: vs existing nests (same week) AND vs last week ──
  const isMetrofunNest=r=>(r.metrofun_nests||'').toLowerCase().includes('metrofun');
  const metroRows=allWeekData.filter(isMetrofunNest);
  const restRows=allWeekData.filter(r=>!isMetrofunNest(r));
  const metroStats=metroRows.length?computeStats(metroRows):null;
  const restStats=restRows.length?computeStats(restRows):null;
  const metroRowsPrev=prevWeekData?prevWeekData.filter(isMetrofunNest):null;
  const metroStatsPrev=metroRowsPrev&&metroRowsPrev.length?computeStats(metroRowsPrev):null;
  const metroDeltaLine=(label,html)=>html?`<div style="font-size:10px;margin-top:2px;white-space:nowrap"><span style="color:#94A3B8">${label}:</span> ${html}</div>`:'';
  const metroCardHtml=metroStats?`
    <div style="display:flex;flex-wrap:wrap;border:1px solid #BAE6FD;border-radius:8px;overflow:hidden;background:#F0FBFF">
      <div style="padding:10px 16px;border-right:1px solid #BAE6FD">
        <div style="font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0284C7">Releases</div>
        <div style="font-size:20px;font-weight:700;color:#0D1B3E">${fmtN(metroStats.count)}</div>
        ${metroStatsPrev?metroDeltaLine('vs last week',wow(metroStats.count-metroStatsPrev.count,false,'n',pctOf(metroStats.count-metroStatsPrev.count,metroStatsPrev.count))):''}
      </div>
      <div style="padding:10px 16px;border-right:1px solid #BAE6FD">
        <div style="font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0284C7">Avg GR/RLS</div>
        <div style="font-size:20px;font-weight:700;color:#29C6F0">${fmt$(metroStats.avgGRR)}</div>
        ${restStats?metroDeltaLine('vs other nests',wow(metroStats.avgGRR-restStats.avgGRR,false,'$',pctOf(metroStats.avgGRR-restStats.avgGRR,restStats.avgGRR))):''}
        ${metroStatsPrev?metroDeltaLine('vs last week',wow(metroStats.avgGRR-metroStatsPrev.avgGRR,false,'$',pctOf(metroStats.avgGRR-metroStatsPrev.avgGRR,metroStatsPrev.avgGRR))):''}
      </div>
      <div style="padding:10px 16px;border-right:1px solid #BAE6FD">
        <div style="font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0284C7">Avg HTR</div>
        <div style="font-size:20px;font-weight:700;color:#475569">${fmtH(metroStats.avgHTR)}</div>
        ${restStats&&metroStats.avgHTR!=null&&restStats.avgHTR!=null?metroDeltaLine('vs other nests',wow(metroStats.avgHTR-restStats.avgHTR,true,'h',pctOf(metroStats.avgHTR-restStats.avgHTR,restStats.avgHTR))):''}
        ${metroStatsPrev&&metroStats.avgHTR!=null&&metroStatsPrev.avgHTR!=null?metroDeltaLine('vs last week',wow(metroStats.avgHTR-metroStatsPrev.avgHTR,true,'h',pctOf(metroStats.avgHTR-metroStatsPrev.avgHTR,metroStatsPrev.avgHTR))):''}
      </div>
      <div style="padding:10px 16px;display:flex;align-items:center;color:#64748B;font-size:11px">vs. ${fmtN(restStats?restStats.count:0)} releases from existing nests${metroStatsPrev?` · ${fmtN(metroStatsPrev.count)} metrofun releases last week`:''}</div>
    </div>`:'';

  // ── type table — releases / GR/RLS / HTR, each with WoW ──
  const totalRelPrev=overallPrev?overallPrev.count:null;
  const typeTableHtml=`
    <div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums">
      <thead><tr style="background:#F8FAFC;border-bottom:2px solid #E2E8F0">
        ${['Type','Releases','Δ WoW','Share','GR/RLS','Δ WoW','HTR','Δ WoW'].map((h,i)=>`<th style="padding:3px ${i===0?8:5}px;text-align:left;font-size:8.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#94A3B8;white-space:nowrap">${h}</th>`).join('')}
      </tr></thead>
      <tbody>${typeRows.map(({label,d,p,isMain})=>{
        const pct=(d.count/overall.count*100).toFixed(0);
        const relD=p?d.count-p.count:null;
        const gD=p?d.avgGRR-p.avgGRR:null;
        const hD=p&&d.avgHTR!=null&&p.avgHTR!=null?d.avgHTR-p.avgHTR:null;
        return `<tr style="border-bottom:1px solid #F1F5F9;${isMain?'':'opacity:0.72'}">
          <td style="padding:3px 8px;font-weight:${isMain?700:500};color:#0D1B3E;white-space:nowrap">${label}</td>
          <td style="padding:3px 5px;color:#334155;font-weight:600">${fmtN(d.count)}</td>
          <td style="padding:3px 5px;white-space:nowrap">${wow(relD,false,'n',pctOf(relD,p&&p.count))}</td>
          <td style="padding:3px 5px"><div style="display:flex;align-items:center;gap:4px"><div style="width:${Math.max(3,parseFloat(pct)*0.5)}px;height:5px;border-radius:2px;background:#29C6F0;opacity:0.6"></div><span style="color:#64748B;font-size:11px">${pct}%</span></div></td>

        <td style="padding:4px 5px;white-space:nowrap">${wow(overallPrev?overall.count-overallPrev.count:null,false,'n',overallPrev?pctOf(overall.count-overallPrev.count,overallPrev.count):null)}</td>
        <td style="padding:4px 5px;color:#64748B;font-size:11px">100%</td>
        <td style="padding:4px 5px;font-weight:700;color:#29C6F0">${fmt$(overall.avgGRR)}</td>
        <td style="padding:4px 5px;white-space:nowrap">${wow(overallPrev?overall.avgGRR-overallPrev.avgGRR:null,false,'$',overallPrev?pctOf(overall.avgGRR-overallPrev.avgGRR,overallPrev.avgGRR):null)}</td>
        <td style="padding:4px 5px;color:#475569">${fmtH(overall.avgHTR)}</td>
        <td style="padding:4px 5px;white-space:nowrap">${wow(overallPrev&&overall.avgHTR!=null&&overallPrev.avgHTR!=null?overall.avgHTR-overallPrev.avgHTR:null,true,'h',(overallPrev&&overall.avgHTR!=null&&overallPrev.avgHTR!=null)?pctOf(overall.avgHTR-overallPrev.avgHTR,overallPrev.avgHTR):null)}</td>
      </tr></tbody>
    </table></div>`;

  // ── hood table — top 10 by release volume ──
  const maxHoodCount=Math.max(...topHoods.map(h=>h.count),1);
  const hoodTableHtml=`
    <table style="width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums">
      <thead><tr style="background:#F8FAFC;border-bottom:2px solid #E2E8F0">
        ${['#','Neighborhood','Releases','Δ WoW','GR/RLS','Δ WoW','HTR'].map(h=>`<th style="padding:4px 8px;text-align:left;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#94A3B8">${h}</th>`).join('')}
      </tr></thead>
      <tbody>${topHoods.map((h,i)=>{
        const ph=prevByHood[h.name];
        const gD=ph?h.avgGRR-ph.avgGRR:null;
        const relD=ph?h.count-ph.count:null;
        const bw=Math.round((h.count/maxHoodCount)*46);
        return `<tr style="border-bottom:1px solid #F1F5F9">
          <td style="padding:4px 8px;color:#94A3B8;font-weight:700">${i+1}</td>
          <td style="padding:4px 8px;font-weight:600;color:#0D1B3E">${h.name}</td>
          <td style="padding:4px 8px"><div style="display:flex;align-items:center;gap:5px"><div style="width:${bw}px;height:7px;background:#29C6F0;opacity:.55;border-radius:2px"></div><span style="font-weight:700;color:#334155">${fmtN(h.count)}</span></div></td>
          <td style="padding:4px 8px">${wow(relD,false,'n',pctOf(relD,ph&&ph.count))}</td>
          <td style="padding:4px 8px;font-weight:700;color:#29C6F0">${fmt$(h.avgGRR)}</td>
          <td style="padding:4px 8px">${wow(gD,false,'$',pctOf(gD,ph&&ph.avgGRR))}</td>
          <td style="padding:4px 8px;color:#475569">${fmtH(h.avgHTR)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;

  // ── free text (persisted per week) ──
  const wKey='exec_notes_global';
  let savedNotes={did:'',plan:''};
  try{const s=localStorage.getItem(wKey);if(s)savedNotes=JSON.parse(s);}catch(e){}

  const notesHtml=`
    <div>
      <div style="display:none"><textarea id="execNotesDid" onblur="saveExecNotes()">${savedNotes.did}</textarea></div>
      <textarea id="execNotesPlan" onblur="saveExecNotes()" placeholder="Notes…"
        style="width:100%;height:110px;resize:vertical;padding:10px;border-radius:6px;border:1px solid #E2E8F0;font-family:inherit;font-size:12px;color:#334155;outline:none;line-height:1.6;background:#FAFCFF"
        onfocus="this.style.borderColor='#29C6F0'" onblur="this.style.borderColor='#E2E8F0';saveExecNotes()">${savedNotes.plan}</textarea>
    </div>`;

  // ── assemble ──
  const header=`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #E2E8F0">
      <div>
        <div style="font-size:11px;font-weight:700;color:#94A3B8;letter-spacing:.06em;text-transform:uppercase">V2 Release Performance</div>
        <div style="font-size:18px;font-weight:700;color:#0D1B3E;margin-top:2px">
          <span style="color:#29C6F0">${weekLabel}</span>
          <span style="font-size:12px;font-weight:500;color:#94A3B8;margin-left:10px">vs ${prevWeekLabel}</span>
        </div>
      </div>
      <button onclick="downloadPPTX()" style="padding:7px 16px;border-radius:6px;background:#29C6F0;color:#0D1B3E;font-size:12px;font-weight:700;border:none;cursor:pointer">⬇ Export PPTX</button>
    </div>`;

  const kpiRowHtml=(()=>{
    function kpi(label,val,delta,inv,prefix){
      const d=delta!=null?(inv?-delta:delta):null;
      const good=d!=null&&d>0;
      const col=d==null?null:good?'#16A34A':'#DC2626';
      const abs=d==null?null:(prefix==='$'?'$'+Math.abs(delta).toFixed(2):prefix==='%'?Math.abs(delta).toFixed(1)+'pp':Math.abs(delta).toFixed(prefix==='h'?1:0)+(prefix==='h'?'h':''));
      return `<div style="padding:10px 16px;border-right:1px solid #E2E8F0">
        <div style="font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#94A3B8;margin-bottom:4px">${label}</div>
        <div style="font-size:24px;font-weight:700;color:#0D1B3E;line-height:1;font-variant-numeric:tabular-nums">${val}</div>
        ${d!=null?`<div style="margin-top:5px;font-size:11px;font-weight:700;color:${col}">${delta>0?'▲ +':'▼ '}${abs} WoW</div>`:'<div style="margin-top:5px;font-size:11px;color:#CBD5E1">no prev week</div>'}
      </div>`;
    }
    const relD=overallPrev?overall.count-overallPrev.count:null;
    const grrD=overallPrev?overall.avgGRR-overallPrev.avgGRR:null;
    const htrD=overallPrev&&overall.avgHTR!=null&&overallPrev.avgHTR!=null?overall.avgHTR-overallPrev.avgHTR:null;
    const capD=overallPrev&&overall.captureRate24h!=null&&overallPrev.captureRate24h!=null?(overall.captureRate24h-overallPrev.captureRate24h)*100:null;
    return `<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-bottom:1px solid #E2E8F0">
      ${kpi('Total Releases',fmtN(overall.count),relD,false,'')}
      ${kpi('Avg GR/RLS',fmt$(overall.avgGRR),grrD,false,'$')}
      ${kpi('Med HTR',fmtH(overall.avgHTR),htrD,true,'h')}
      ${kpi('Ride Capture (24h)',overall.captureRate24h!=null?(overall.captureRate24h*100).toFixed(1)+'%':'—',capD,false,'%')}
    </div>`;
  })();

  const lbl=`font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#94A3B8;margin-bottom:7px`;
  const body=`
    ${kpiRowHtml}
    <div data-tbl style="padding:10px 16px;border-bottom:1px solid #E2E8F0">
      <div style="${lbl};display:flex;align-items:center;justify-content:space-between">What happened this week — by release type <span style="text-transform:none;letter-spacing:0;font-weight:500;color:#CBD5E1">(vs ${prevWeekLabel})</span> ${csvBtn('by-release-type')}</div>
      ${typeTableHtml}
    </div>
    ${metroCardHtml?`<div data-tbl style="padding:10px 16px;border-bottom:1px solid #E2E8F0">
      <div style="${lbl}">🆕 Metrofun Nests — new cell type performance</div>
      ${metroCardHtml}
    </div>`:''}
    <div style="display:grid;grid-template-columns:1.15fr 1fr;gap:0;border-bottom:1px solid #E2E8F0">
      <div data-tbl style="padding:10px 16px;border-right:1px solid #E2E8F0">
        <div style="${lbl};display:flex;align-items:center;justify-content:space-between">Top 10 Neighborhoods by Release Volume ${csvBtn('exec-top-neighborhoods')}</div>
        ${hoodTableHtml}
      </div>
      <div style="padding:10px 16px">
        <div style="${lbl}">Opportunities &amp; Underperforming</div>
        ${insightsHtml}
      </div>
    </div>`;

  window._execNotesKey='exec_notes_global';

  return `<div style="padding:8px 0 48px">
    ${execSlideWrap(header, body)}
  </div>`;
}

let _execMap=null;
function initExecMap(){
  const el=document.getElementById('execMapMount');
  if(!el||typeof L==='undefined') return;
  if(_execMap){try{_execMap.remove();}catch(e){} _execMap=null;}

  // Build nest data (reuse same aggregation logic as nest map)
  const weekData=byCity(allWeeks[currentWeekIdx]?rawData.filter(r=>parseInt(r.release_week)===allWeeks[currentWeekIdx].num):rawData);
  const nestMap={};
  weekData.forEach(r=>{
    const id=r.nest_id||r.nest_address; if(!id) return;
    const c=_coord(r); if(!c) return;
    const lat=c[0], lon=c[1];
    const grr=parseFloat(r.gross_revenue_24h_usd)||0;
    if(!nestMap[id]) nestMap[id]={lat,lon,sumGRR:0,cntGRR:0};
    if(grr>0){nestMap[id].sumGRR+=grr;nestMap[id].cntGRR++;}
  });
  let nests=Object.values(nestMap).map(n=>({...n,avgGRR:n.cntGRR>0?n.sumGRR/n.cntGRR:0}));
  if(!nests.length) nests=NEST_GRR_DATA.map(n=>({lat:n.lat,lon:n.lon,avgGRR:n.avg_grr||0}));
  if(!nests.length){el.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#94A3B8;font-size:13px">No nest location data</div>';return;}

  const lats=nests.map(n=>n.lat), lons=nests.map(n=>n.lon);
  const center=[(Math.min(...lats)+Math.max(...lats))/2,(Math.min(...lons)+Math.max(...lons))/2];

  _execMap=L.map(el,{zoomControl:false,attributionControl:false,scrollWheelZoom:false,dragging:false,doubleClickZoom:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(_execMap);
  _execMap.setView(center,12);

  const heatMax=Math.max(...nests.map(n=>n.avgGRR))||1;
  const heatPts=nests.map(n=>[n.lat,n.lon,Math.max(0.15,n.avgGRR/heatMax)]);
  if(typeof L.heatLayer==='function'){
    L.heatLayer(heatPts,{radius:22,blur:15,minOpacity:0.25,max:0.9,
      gradient:{0.2:'#4A90D9',0.45:'#29C6F0',0.65:'#F5A623',0.85:'#F0656A',1.0:'#DC2626'}
    }).addTo(_execMap);
  }
  setTimeout(()=>_execMap&&_execMap.invalidateSize(),100);
}

// ── PPTX EXPORT ──────────────────────────────────────────────────────────────
function downloadPPTX(){
  if(typeof PptxGenJS==='undefined'){alert('PPTX library not loaded. Please try again in a moment.');return;}
  const {overall,overallPrev,segments,bestDay,bestHour,worstDay,weekLabel,allWeekData,prevByHood}=getExecData();

  // Strip HTML tags from insight bodies for plain-text slides
  const stripHtml=s=>String(s).replace(/<[^>]+>/g,'');

  // Opportunities & Underperforming — across all release types (matches on-screen exec summary)
  const chargeLabel='all types';
  const {opps,warns}=generateInsights(overall);

  // Top neighborhoods (matches on-screen table)
  const topHoods=Object.entries(overall.byHood)
    .map(([name,d])=>({name,...d}))
    .filter(h=>h.count>=3&&!/^unknown$/i.test(h.name))
    .sort((a,b)=>b.count-a.count).slice(0,6);

  // Day & hour peak/low
  const dhMtx={};
  (allWeekData||[]).forEach(r=>{
    const day=r.release_weekday_name; const hr=r.release_hour!==''?parseInt(r.release_hour):null;
    const grr=parseFloat(r.gross_revenue_24h_usd);
    if(!day||hr==null) return;
    const k=day+'|'+hr;
    if(!dhMtx[k]) dhMtx[k]={day,hr,sum:0,cnt:0};
    dhMtx[k].cnt++; if(!isNaN(grr)&&grr>0) dhMtx[k].sum+=grr;
  });
  const dhRanked=Object.values(dhMtx).filter(c=>c.cnt>=2).map(c=>({...c,avg:c.cnt?c.sum/c.cnt:0})).sort((a,b)=>b.avg-a.avg);
  const dhBest=dhRanked[0], dhWorst=dhRanked[dhRanked.length-1];

  // Notes from localStorage
  let execNotes='';
  try{const s=localStorage.getItem('exec_notes_global');if(s){const o=JSON.parse(s);execNotes=[o.did,o.plan].filter(Boolean).join('\n\n');}}catch(e){}

  const prs=new PptxGenJS();
  prs.layout='LAYOUT_WIDE'; // 13.33 x 7.5 inches
  prs.author='Bird Rides';
  prs.title=`V2 Release Performance ${weekLabel}`;

  const ESB='0FA5CE', NAVY='0D1B3E', WHITE='FFFFFF', GRAY='A8BDD4', DARK='07112B';
  const GOOD='16A34A', WARN='D97706', BAD='DC2626';
  // Light theme
  const PAGE='FFFFFF', CARD='F8FAFC', BORDER='E2E8F0', HDR='F1F5F9', ROW='FFFFFF', ROWALT='F8FAFC';
  const INK='0D1B3E', MUTE='475569', LABEL='94A3B8';

  function addSlide(title, bodyFn){
    const s=prs.addSlide();
    // Background
    s.background={fill:PAGE};
    // Header bar
    s.addShape(prs.ShapeType.rect,{x:0,y:0,w:'100%',h:0.7,fill:{color:NAVY},line:{color:NAVY}});
    // ESB accent line
    s.addShape(prs.ShapeType.rect,{x:0,y:0.7,w:'100%',h:0.04,fill:{color:ESB},line:{color:ESB}});
    // Title
    s.addText(title,{x:0.3,y:0.12,w:12,h:0.5,fontSize:16,bold:true,color:WHITE,fontFace:'DM Sans'});
    bodyFn(s);
    // Footer
    s.addText('Bird Rides — Confidential',{x:0.3,y:7.22,w:6,h:0.25,fontSize:8,color:LABEL,fontFace:'DM Sans'});
  }

  function kpiBox(s,x,y,w,label,val,delta,deltaGood){
    s.addShape(prs.ShapeType.rect,{x,y,w,h:1.1,fill:{color:CARD},line:{color:BORDER,pt:1}});
    s.addText(label.toUpperCase(),{x:x+0.1,y:y+0.1,w:w-0.2,h:0.25,fontSize:8,color:LABEL,bold:true,charSpacing:1,fontFace:'DM Sans'});
    s.addText(val,{x:x+0.1,y:y+0.3,w:w-0.2,h:0.5,fontSize:20,bold:true,color:INK,fontFace:'DM Sans'});
    if(delta!=null){
      const col=deltaGood?GOOD:BAD;
      s.addText(delta,{x:x+0.1,y:y+0.78,w:w-0.2,h:0.25,fontSize:9,color:col,bold:true,fontFace:'DM Sans'});
    }
  }

  function tableRows(s,x,y,headers,rows,colW){
    // header row
    let cx=x;
    headers.forEach((h,i)=>{
      s.addShape(prs.ShapeType.rect,{x:cx,y,w:colW[i],h:0.28,fill:{color:HDR},line:{color:BORDER,pt:1}});
      s.addText(h.toUpperCase(),{x:cx+0.05,y:y+0.05,w:colW[i]-0.1,h:0.2,fontSize:7.5,color:LABEL,bold:true,charSpacing:0.5,fontFace:'DM Sans'});
      cx+=colW[i];
    });
    rows.forEach((row,ri)=>{
      cx=x;
      row.forEach((cell,ci)=>{
        s.addShape(prs.ShapeType.rect,{x:cx,y:y+0.28+ri*0.3,w:colW[ci],h:0.3,fill:{color:ri%2===0?ROW:ROWALT},line:{color:BORDER,pt:1}});
        s.addText(String(cell),{x:cx+0.05,y:y+0.28+ri*0.3+0.06,w:colW[ci]-0.1,h:0.2,fontSize:9,color:ci===0?INK:MUTE,bold:ci===0,fontFace:'DM Sans'});
        cx+=colW[ci];
      });
    });
  }

  function sectionLabel(s,x,y,w,text){
    s.addText(text.toUpperCase(),{x,y,w,h:0.25,fontSize:9,bold:true,color:INK,charSpacing:1,fontFace:'DM Sans'});
  }

  // ── Single Exec Summary slide ──
  addSlide('V2 Release Performance', s=>{
    // KPIs (full width, top)
    const kpis=[
      {l:'Total Releases',v:fmtN(overall.count),d:overallPrev?`${overall.count>overallPrev.count?'↑ +':'↓ '}${Math.abs(overall.count-overallPrev.count)} WoW`:null,ok:overall.count>=(overallPrev?.count||0)},
      {l:'Avg GR/RLS',v:fmt$(overall.avgGRR),d:overallPrev?`${overall.avgGRR>overallPrev.avgGRR?'↑ +':'↓ '}$${Math.abs(overall.avgGRR-overallPrev.avgGRR).toFixed(2)} WoW`:null,ok:overall.avgGRR>=(overallPrev?.avgGRR||0)},
      {l:'Avg HTR',v:fmtH(overall.avgHTR),d:overallPrev&&overall.avgHTR!=null&&overallPrev.avgHTR!=null?`${overall.avgHTR<overallPrev.avgHTR?'↑ -':'↓ +'}${Math.abs(overall.avgHTR-overallPrev.avgHTR).toFixed(1)}h WoW`:null,ok:overall.avgHTR!=null&&overallPrev?.avgHTR!=null&&overall.avgHTR<overallPrev.avgHTR},
    ];
    kpis.forEach((k,i)=>kpiBox(s,0.3+i*4.3,0.85,4.0,k.l,k.v,k.d,k.ok));

    // ── LEFT: Opportunities & Underperforming (all release types) ──
    sectionLabel(s,0.3,1.98,6.2,`Opportunities & Underperforming · ${chargeLabel}`);
    let iy=2.24;
    const drawInsight=(it,col)=>{
      const body=stripHtml(it.body);
      s.addShape(prs.ShapeType.rect,{x:0.3,y:iy,w:6.2,h:0.68,fill:{color:CARD},line:{color:BORDER,pt:1}});
      s.addShape(prs.ShapeType.rect,{x:0.3,y:iy,w:0.06,h:0.68,fill:{color:col},line:{color:col}});
      s.addText([{text:(it.tag+'  ').toUpperCase(),options:{color:col,bold:true,fontSize:7}},{text:it.title,options:{color:INK,bold:true,fontSize:8.5}}],{x:0.45,y:iy+0.03,w:5.95,h:0.2,fontFace:'DM Sans'});
      s.addText(body,{x:0.45,y:iy+0.23,w:5.95,h:0.4,fontSize:7,color:MUTE,fontFace:'DM Sans',valign:'top'});
      iy+=0.74;
    };
    opps.slice(0,3).forEach(o=>drawInsight(o,GOOD));
    warns.slice(0,3).forEach(w=>drawInsight(w,WARN));

    // ── RIGHT: Release Type, Neighborhoods ──
    sectionLabel(s,6.8,1.98,6.2,'Performance by Release Type');
    const EXCLUDE_TYPES=/load|deploy|recover|damage/i;
    const typeRows=Object.entries(overall.byType)
      .filter(([t])=>!EXCLUDE_TYPES.test(t))
      .sort((a,b)=>b[1].count-a[1].count).slice(0,5)
      .map(([t,d])=>[formatTypeLabel(t),fmtN(d.count),(d.count/overall.count*100).toFixed(0)+'%',fmt$(d.avgGRR),fmtH(d.avgHTR)]);
    tableRows(s,6.8,2.22,['Type','Rel.','Share','GR/RLS','HTR'],typeRows,[2.5,0.95,0.95,0.95,0.85]);

    const hoodY=2.22+0.28+typeRows.length*0.3+0.32;
    sectionLabel(s,6.8,hoodY-0.26,6.2,'Top Neighborhoods');
    const hoodRows=topHoods.slice(0,6).map(h=>[h.name,fmt$(h.avgGRR),fmtN(h.count),fmtH(h.avgHTR)]);
    tableRows(s,6.8,hoodY,['Neighborhood','GR/RLS','Rel.','HTR'],hoodRows,[3.0,1.1,1.1,0.9]);
  });


  const fileName=`Bird_Release_Performance_${weekLabel.replace(/[^a-zA-Z0-9]/g,'_')}.pptx`;
  prs.write({outputType:'base64'}).then(b64=>{
    const mime='application/vnd.openxmlformats-officedocument.presentationml.presentation';
    const a=document.createElement('a');
    a.href=`data:${mime};base64,${b64}`;
    a.download=fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }).catch(e=>{console.error(e);alert('PPTX generation failed: '+e.message);});
}

        {tag:'Volume + Quality', label:'High-volume, high-GR/RLS zones', desc:'Neighborhoods with release count > 150% of the per-neighborhood average AND GR/RLS > 110% of overall average. These are your workhorses — protect them from underallocation.'},
        {tag:'Zero-Revenue Releases', label:'Audit alert', desc:'Counts releases where gross_revenue_24h_usd = $0. These are vehicles that generated no revenue in 24 hours. A high zero-revenue rate in a specific area or hour is a direct target for improvement.'},
      ]
    },
  ];

  const metricsHtml = `
    <div class="panel" style="margin-bottom:18px">
      <div class="panel-head"><span class="panel-title">Metrics Glossary</span></div>
      <div style="padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
        <div style="background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:14px">
          <div style="font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">GR/RLS</div>
          <div style="font-size:13px;font-weight:700;color:var(--t1);margin-bottom:4px">Gross Revenue per Release</div>
          <div style="font-size:12px;color:var(--t2);line-height:1.6">Field: <code style="background:var(--s3);padding:1px 5px;border-radius:4px;font-size:11px">gross_revenue_24h_usd</code><br>Revenue generated in the 24 hours after a release. <strong>Includes $0 releases</strong> in the average — they are real zero-revenue events, not missing data.</div>
        </div>
        <div style="background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:14px">
          <div style="font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">HTR</div>
          <div style="font-size:13px;font-weight:700;color:var(--t1);margin-bottom:4px">Hours to Ride</div>
          <div style="font-size:12px;color:var(--t2);line-height:1.6">Field: <code style="background:var(--s3);padding:1px 5px;border-radius:4px;font-size:11px">hours_to_ride</code><br>Time from release until the first ride. Lower = faster pickup. Color coding: <span style="color:var(--good)">green &lt;8h</span>, <span style="color:var(--warn)">amber 8–15h</span>, <span style="color:var(--bad)">red &gt;15h</span>.</div>
        </div>
        <div style="background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:14px">
          <div style="font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">GR/RLS Pill Colors</div>
          <div style="font-size:13px;font-weight:700;color:var(--t1);margin-bottom:4px">Rank-based, not absolute</div>
          <div style="font-size:12px;color:var(--t2);line-height:1.6">Colors are relative to <em>your dataset</em>: <span style="color:var(--good)">green = top 25%</span>, <span style="color:var(--warn)">amber = middle 50%</span>, <span style="color:var(--bad)">red = bottom 25%</span>. They shift as data changes — there is no fixed dollar threshold.</div>
        </div>
      </div>
    </div>`;

  const perspectivesHtml = cards.map(c=>`
    <div class="panel" style="margin-bottom:14px;border-color:${c.border};background:${c.bg}">
      <div class="panel-head" style="background:transparent;border-color:${c.border}">
        <span style="font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:${c.color}">${c.perspective}</span>
        <span class="panel-title">${c.title}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:none">
        ${c.rules.map((r,i)=>`
          <div style="padding:14px 16px;${i<c.rules.length-1?'border-right:1px solid var(--border)':''}">
            <div style="font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:${c.color};margin-bottom:4px">${r.tag}</div>
            <div style="font-size:13px;font-weight:700;color:var(--t1);margin-bottom:6px">${r.label}</div>
            <div style="font-size:12px;color:var(--t2);line-height:1.6">${r.desc}</div>
          </div>`).join('')}
      </div>
    </div>`).join('');

  const qaHtml = `
    <div class="panel" style="margin-bottom:18px">
      <div class="panel-head"><span class="panel-title">Ask Bar — Supported Queries</span></div>
      <div style="padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
        ${[
          ['"best neighborhood"','Top 5 neighborhoods by avg GR/RLS (min 3 releases)'],
          ['"worst neighborhood"','Bottom 5 neighborhoods by avg GR/RLS (min 3 releases)'],
          ['"peak hour"','Top 5 hours by avg GR/RLS (min 2 releases)'],
          ['"worst hour"','Weakest 5 hours by avg GR/RLS'],
          ['"best day"','All days ranked by avg GR/RLS'],
          ['"htr"','Top 5 neighborhoods by fastest pickup time'],
          ['"compare types"','GR/RLS, HTR, and count broken down by release type'],
          ['"zero revenue"','Count and % of releases with $0 in 24h'],
          ['"total revenue"','Total rev and avg GR/RLS for current selection'],
          ['Any neighborhood name','Stats for that specific area'],
        ].map(([q,d])=>`
          <div style="display:flex;gap:10px;align-items:flex-start;padding:8px 10px;background:var(--s2);border-radius:var(--r);border:1px solid var(--border)">
            <code style="background:var(--s3);padding:2px 7px;border-radius:4px;font-size:11px;color:var(--accent);white-space:nowrap;flex-shrink:0">${q}</code>
            <span style="font-size:12px;color:var(--t2)">${d}</span>
          </div>`).join('')}
      </div>
    </div>`;

  return metricsHtml + perspectivesHtml + qaHtml;
}

// ── Q&A ──────────────────────────────────────────────────────────────────────
function answerQuestion(q){
  if(!rawData.length) return 'No data loaded yet.';
  const lq=q.toLowerCase().trim();
  const data=getFilteredData();
  const stats=computeStats(data);
  if(!stats) return 'No data for this selection.';

  const hoodNames=Object.keys(stats.byHood);
  const mh=hoodNames.find(h=>lq.includes(h.toLowerCase())||lq.includes(h.replace('Tel Aviv - ','').toLowerCase()));
  if(mh){const b=stats.byHood[mh];return `<strong>${mh}</strong>: ${b.count} releases · GR/RLS <strong>${fmt$(b.avgGRR)}</strong> (${((b.avgGRR/stats.avgGRR-1)*100).toFixed(0)}% vs avg) · Total ${fmt$(b.totalRev)} · HTR ${fmtH(b.avgHTR)}`;}

  if(/best.*(neighborhood|area|zone)|top.*neighborhood|highest.*gr/.test(lq)){const top=Object.entries(stats.byHood).filter(([,d])=>d.count>=3).sort((a,b)=>b[1].avgGRR-a[1].avgGRR).slice(0,5);return '<strong>Top 5 by GR/RLS:</strong><br>'+top.map(([n,d],i)=>`${i+1}. ${n} — ${fmt$(d.avgGRR)} (${d.count} releases)`).join('<br>');}
  if(/(worst|lowest|weakest).*(neighborhood|area|zone)/.test(lq)){const bot=Object.entries(stats.byHood).filter(([,d])=>d.count>=3).sort((a,b)=>a[1].avgGRR-b[1].avgGRR).slice(0,5);return '<strong>Bottom 5 by GR/RLS:</strong><br>'+bot.map(([n,d],i)=>`${i+1}. ${n} — ${fmt$(d.avgGRR)} (${d.count})`).join('<br>');}
  if(/best.*hour|peak.*hour/.test(lq)){const top=Object.entries(stats.byHour).filter(([,d])=>d.count>=2).sort((a,b)=>b[1].avgGRR-a[1].avgGRR).slice(0,5);return '<strong>Top hours by GR/RLS:</strong><br>'+top.map(([h,d])=>`${h}:00 — ${fmt$(d.avgGRR)} (${d.count} rel.)`).join('<br>');}
  if(/worst.*hour|dead.*hour/.test(lq)){const bot=Object.entries(stats.byHour).filter(([,d])=>d.count>=2).sort((a,b)=>a[1].avgGRR-b[1].avgGRR).slice(0,5);return '<strong>Weakest hours:</strong><br>'+bot.map(([h,d])=>`${h}:00 — ${fmt$(d.avgGRR)} (${d.count} rel.)`).join('<br>');}
  if(/best.*day|top.*day/.test(lq)){return '<strong>Days ranked by GR/RLS:</strong><br>'+Object.entries(stats.byDay).sort((a,b)=>b[1].avgGRR-a[1].avgGRR).map(([d,b])=>`${d} — ${fmt$(b.avgGRR)} (${b.count} rel.)`).join('<br>');}
  if(/htr|hours.to.ride|time.to.ride/.test(lq)){const top=Object.entries(stats.byHood).filter(([,d])=>d.avgHTR!=null&&d.count>=3).sort((a,b)=>a[1].avgHTR-b[1].avgHTR).slice(0,5);return '<strong>Lowest HTR (fastest pickup):</strong><br>'+top.map(([n,d])=>`${n} — ${fmtH(d.avgHTR)} (${d.count} rel.)`).join('<br>');}
  if(/compar|type|charge|rebalanc|recover|ad.hoc/.test(lq)){return '<strong>By release type:</strong><br>'+Object.entries(stats.byType).sort((a,b)=>b[1].avgGRR-a[1].avgGRR).map(([t,d])=>`${formatTypeLabel(t)} — ${fmt$(d.avgGRR)} GR/RLS · ${fmtH(d.avgHTR)} HTR · ${d.count} releases`).join('<br>');}
  if(/week|weekly/.test(lq)&&allWeeks.length){const w=allWeeks[currentWeekIdx];return `<strong>Week ${w.num} (${w.label})</strong>: ${fmtN(stats.count)} releases · Avg GR/RLS ${fmt$(stats.avgGRR)} · Total Rev ${fmt$(stats.totalRev)}`;}
  if(/total|revenue/.test(lq)){return `Total revenue: <strong>${fmt$(stats.totalRev)}</strong> across ${stats.count} releases. Avg GR/RLS: <strong>${fmt$(stats.avgGRR)}</strong>.`;}
  if(/zero|no.revenue/.test(lq)){const z=data.filter(r=>(parseFloat(r.gross_revenue_24h_usd)||0)===0).length;return `<strong>${z} releases (${(z/stats.count*100).toFixed(1)}%)</strong> generated $0 in 24h.`;}
  return `<strong>Week ${allWeeks[currentWeekIdx]?.num||'—'} Summary:</strong> ${fmtN(stats.count)} releases · Avg GR/RLS <strong>${fmt$(stats.avgGRR)}</strong> · Avg HTR ${fmtH(stats.avgHTR)} · Total Rev ${fmt$(stats.totalRev)}<br><br><span style="color:var(--t3)">Try: "best neighborhood", "peak hour", "worst day", "compare types", "htr", "zero revenue"</span>`;
}

// ── TABLE SORT ────────────────────────────────────────────────────────────────
function attachSort(){
  document.querySelectorAll('thead th[data-key]').forEach(th=>{
    th.addEventListener('click',()=>{
      const k=th.dataset.key;
      if(sortKey===k) sortDir=-sortDir;
      else{sortKey=k;sortDir=-1;}
      render();
    });
  });
}

// ── UPLOAD ────────────────────────────────────────────────────────────────────
function setupDropZone(){
  const dz=document.getElementById('dropZone');
  if(!dz) return;
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
  dz.addEventListener('drop',e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);});
}

// ── PERSISTENCE (IndexedDB — data survives closing the tab) ───────────────────
function _idb(){
  return new Promise((res,rej)=>{
    const rq=indexedDB.open('birdDash',1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);
  });
}
async function idbSet(k,v){ const db=await _idb(); return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}); }
async function idbGet(k){ const db=await _idb(); return new Promise((res,rej)=>{const tx=db.transaction('kv','readonly');const rq=tx.objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);}); }
async function idbClear(){ const db=await _idb(); return new Promise((res)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').clear();tx.oncomplete=()=>res();}); }

// Columns the dashboard never uses but that bloat storage (huge WKT polygons)
const HEAVY_COLS=['zone_polygon','polygon_level'];
function stripHeavy(rows){ rows.forEach(r=>{ HEAVY_COLS.forEach(c=>{ if(c in r) delete r[c]; }); }); return rows; }

function applyReleases(rows,{persist=true}={}){
  rawData=stripHeavy(rows);
  allWeeks=buildWeeks(rawData);
  buildCities(rawData);
  currentWeekIdx=-1; // default: show all data
  dynamicTabs=buildTabs(rawData);
  tab='__overview__';
  citySel='__all__';
  sortKey='count';sortDir=-1;tableMode='hood';insightMode=0;compareOn=false; hoodSel=new Set();
  const badge=document.getElementById('statusBadge');
  badge.textContent=`${rawData.length.toLocaleString()} releases · ${allWeeks.length} week${allWeeks.length!==1?'s':''}`;
  badge.className='loaded';
  const clr=document.getElementById('clearDataBtn'); if(clr) clr.style.display='inline-block';
  render();
  if(persist){
    idbSet('releasesRows', JSON.stringify(rawData))
      .then(()=>console.log('saved',rawData.length,'rows'))
      .catch(e=>{ console.warn('persist failed',e); alert('Could not save data for next time (browser storage limit). It still works this session.'); });
  }
}
function loadReleasesText(text,opts){ applyReleases(parseCSV(text),opts); }
function loadRecText(text,{persist=true}={}){
  recData=parseCSV(text);
  const badge=document.getElementById('recBadge');
  if(badge){badge.textContent=recData.length.toLocaleString(); badge.style.display='inline-block';}
  if(tab==='__supplygap__') render();
  if(persist) idbSet('recRows', JSON.stringify(recData)).catch(e=>console.warn('persist rec failed',e));
}
function handleFile(file){ if(!file) return; const r=new FileReader(); r.onload=e=>loadReleasesText(e.target.result); r.readAsText(file); }
function handleRecFile(file){ if(!file) return; const r=new FileReader(); r.onload=e=>loadRecText(e.target.result); r.readAsText(file); }
function clearStoredData(){
  if(!confirm('Clear the stored dataset from this browser? You will need to re-upload the CSV.')) return;
  idbClear().finally(()=>location.reload());
}
// Restore persisted data on startup
(async()=>{
  try{
    const j=await idbGet('releasesRows');
    if(j && !rawData.length){ applyReleases(JSON.parse(j),{persist:false}); }
    const rj=await idbGet('recRows');
    if(rj){ recData=JSON.parse(rj); const b=document.getElementById('recBadge'); if(b){b.textContent=recData.length.toLocaleString(); b.style.display='inline-block';} if(tab==='__supplygap__') render(); }
  }catch(e){ console.warn('restore failed',e); }
})();

// ── EVENTS ────────────────────────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change',e=>handleFile(e.target.files[0]));
document.getElementById('recInput').addEventListener('change',e=>handleRecFile(e.target.files[0]));
document.getElementById('qaSubmit').addEventListener('click',()=>{
  const q=document.getElementById('qaInput').value.trim();

});
document.getElementById('qaInput').addEventListener('keydown',e=>{if(e.key==='Enter') document.getElementById('qaSubmit').click();});
document.getElementById('cmpToggle').addEventListener('click',()=>{compareOn=!compareOn;render();});
function setAllWeeks(){currentWeekIdx=-1;compareOn=false;render();}
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeDrill();});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.name.endsWith('.csv')) handleFile(f);});

// ── UNIVERSAL COLUMN SORT — click any table header to sort asc/desc ───────────
function _sortCellVal(tr,col){
  const td=tr.children[col];
  if(!td) return {n:null,s:''};
  const t=(td.textContent||'').replace(/ /g,' ').trim();
  const m=t.replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);
  return {n:m?parseFloat(m[0]):null, s:t.toLowerCase()};
}
function _sortTbody(tbody,col,dir){
  // Group rows into units so an expandable detail row (single colspan cell)
  // travels with the summary row above it.
  const units=[];
  [...tbody.children].forEach(r=>{
    const detail = r.children.length===1 && r.firstElementChild && r.firstElementChild.hasAttribute('colspan');
    if(detail && units.length) units[units.length-1].rows.push(r);
    else units.push({key:r,rows:[r]});
  });
  units.sort((a,b)=>{
    const va=_sortCellVal(a.key,col), vb=_sortCellVal(b.key,col);
    if(va.n!=null&&vb.n!=null) return va.n===vb.n?0:(va.n-vb.n)*dir;
    if(va.n!=null) return -1;            // numbers before blanks/text
    if(vb.n!=null) return 1;
    return va.s<vb.s?-dir:va.s>vb.s?dir:0;
  });
  const frag=document.createDocumentFragment();
  units.forEach(u=>u.rows.forEach(r=>frag.appendChild(r)));
  tbody.appendChild(frag);
}
document.addEventListener('click',e=>{
  const th=e.target.closest('th');
  if(!th) return;
  const thead=th.closest('thead'); if(!thead) return;
  if(th.hasAttribute('data-key')||th.hasAttribute('onclick')) return; // bespoke sorters own these
  const table=th.closest('table'); if(!table||table.dataset.noSort==='1') return;
  const tbody=table.tBodies[0]; if(!tbody||!tbody.children.length) return;
  const ths=[...thead.querySelectorAll('th')];
  const col=ths.indexOf(th); if(col<0) return;
  let dir=-1;
  if(table.dataset.sortCol===String(col)) dir=(table.dataset.sortDir==='1')?-1:1;
  table.dataset.sortCol=String(col); table.dataset.sortDir=String(dir);
  _sortTbody(tbody,col,dir);
  // indicator: a small arrow span, without disturbing header markup
  thead.querySelectorAll('span._sortind').forEach(s=>s.remove());
  const ind=document.createElement('span'); ind.className='_sortind'; ind.textContent=dir<0?' ▼':' ▲'; ind.style.opacity='.75'; ind.style.color='var(--accent)';
  th.appendChild(ind);
});

render();
</script>
